<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibe Squadron - Touch & Upgrades</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 850px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #00001a, #000033);
            touch-action: none;
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        .stats {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bar-container {
            width: 100px;
            height: 10px;
            background: #333;
            border: 1px solid #fff;
            border-radius: 5px;
            overflow: hidden;
        }
        #hpBar { height: 100%; background: #ff3333; width: 100%; transition: width 0.2s; }
        #shieldBar { height: 100%; background: #33aaff; width: 100%; transition: width 0.2s; }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid cyan;
            border-radius: 10px;
            display: none;
            width: 80%;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            padding: 12px 25px;
            background-color: transparent;
            color: cyan;
            border: 2px solid cyan;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        button:hover, button:active {
            background-color: cyan;
            color: black;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="500" height="850"></canvas>
        <div id="ui">
            <div class="stats">
                <div style="color: #ff3333;">HP</div>
                <div class="bar-container"><div id="hpBar"></div></div>
                <div style="color: #33aaff; margin-top: 5px;">Schild</div>
                <div class="bar-container"><div id="shieldBar"></div></div>
            </div>
            <div style="text-align: right;">
                <div>Score: <span id="scoreText">0</span></div>
                <div style="color: #ffaa33; font-size: 14px; margin-top: 5px;">Waffen Lvl: <span id="weaponText">1</span></div>
            </div>
        </div>
        <div id="gameOver">
            <h2>MISSION FAILED</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">Neustart</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const scoreText = document.getElementById('scoreText');
    const weaponText = document.getElementById('weaponText');
    const hpBar = document.getElementById('hpBar');
    const shieldBar = document.getElementById('shieldBar');
    const gameOverScreen = document.getElementById('gameOver');
    const finalScoreText = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');

    let isGameOver = false;
    let score = 0;
    let frameCount = 0;
    let particles = [];
    let projectiles = [];
    let enemies = [];
    let perks = [];

    // --- VERBESSERTE STEUERUNG ---
    let targetX = canvas.width / 2;

    function updatePosition(e) {
        if (isGameOver) return;
        
        if (e.type === 'touchmove' || e.type === 'touchstart') {
            e.preventDefault(); 
        }

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width; 
        
        let clientX;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
        } else {
            clientX = e.clientX;
        }
        
        targetX = (clientX - rect.left) * scaleX;
    }

    canvas.addEventListener('touchstart', updatePosition, { passive: false });
    canvas.addEventListener('touchmove', updatePosition, { passive: false });
    canvas.addEventListener('mousemove', updatePosition);

    const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false, A: false, D: false };
    window.addEventListener('keydown', (e) => { 
        if (keys.hasOwnProperty(e.key)) {
            keys[e.key] = true; 
        }
    });
    window.addEventListener('keyup', (e) => { 
        if (keys.hasOwnProperty(e.key)) {
            keys[e.key] = false; 
        }
    });

    restartBtn.addEventListener('click', () => init());
    restartBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        init();
    });

    // --- KLASSEN ---

    class Entity {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.hp = 100;
            this.maxHp = 100;
            this.shield = 50;
            this.maxShield = 50;
            this.markedForDeletion = false;
        }

        takeDamage(amount) {
            if (this.shield > 0) {
                this.shield -= amount;
                if (this.shield < 0) {
                    this.hp += this.shield;
                    this.shield = 0;
                }
            } else {
                this.hp -= amount;
            }

            if (this.hp <= 0) {
                this.markedForDeletion = true;
                createParticles(this.x, this.y, '#ff8800', 30);
            }
        }

        drawShield(radius) {
            if (this.shield > 0) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                const opacity = Math.max(0.2, this.shield / this.maxShield);
                ctx.strokeStyle = `rgba(51, 170, 255, ${opacity})`;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#33aaff';
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }
    }

    class Wingman extends Entity {
        constructor(offsetX, offsetY) {
            super(0, 0);
            this.offsetX = offsetX;
            this.offsetY = offsetY;
            this.width = 20;
            this.height = 30;
            this.maxHp = 50;
            this.hp = 50;
            this.maxShield = 30;
            this.shield = 30;
        }

        updatePos(playerX, playerY) {
            this.x += ((playerX + this.offsetX) - this.x) * 0.2;
            this.y = playerY + this.offsetY;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(this.width / 2, this.height / 2);
            ctx.lineTo(0, this.height / 4);
            ctx.lineTo(-this.width / 2, this.height / 2);
            ctx.closePath();
            ctx.fillStyle = '#00ffaa';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffaa';
            ctx.fill();
            ctx.restore();

            this.drawShield(22);
            
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(this.x - 15, this.y + 20, 30, 4);
            ctx.fillStyle = '#33ff33';
            ctx.fillRect(this.x - 15, this.y + 20, 30 * (Math.max(0, this.hp) / this.maxHp), 4);
        }
    }

    class Player extends Entity {
        constructor() {
            super(canvas.width / 2, canvas.height - 100);
            this.width = 36;
            this.height = 48;
            this.speed = 8;
            this.weaponLevel = 1;
            this.shootCooldown = 0;
            
            this.maxHp = 100;
            this.hp = 100;
            this.maxShield = 100;
            this.shield = 100;

            this.wingmenSlots = [
                { offset: -55, y: 15, active: null },
                { offset: 55, y: 15, active: null },
                { offset: -95, y: 35, active: null },
                { offset: 95, y: 35, active: null }
            ];
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(this.width / 2, this.height / 2);
            ctx.lineTo(0, this.height / 4);
            ctx.lineTo(-this.width / 2, this.height / 2);
            ctx.closePath();
            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff';
            ctx.fill();
            ctx.restore();

            this.drawShield(35);

            this.wingmenSlots.forEach(slot => {
                if (slot.active) slot.active.draw();
            });
        }

        update() {
            if (keys.ArrowLeft || keys.a || keys.A) targetX -= this.speed;
            if (keys.ArrowRight || keys.d || keys.D) targetX += this.speed;

            if (targetX < 20) targetX = 20;
            if (targetX > canvas.width - 20) targetX = canvas.width - 20;

            this.x += (targetX - this.x) * 0.3;

            if (this.shootCooldown > 0) {
                this.shootCooldown--;
            } else {
                this.shoot();
                this.shootCooldown = Math.max(8, 20 - (this.weaponLevel * 2)); 
            }

            hpBar.style.width = `${Math.max(0, (this.hp / this.maxHp) * 100)}%`;
            shieldBar.style.width = `${Math.max(0, (this.shield / this.maxShield) * 100)}%`;
            weaponText.innerText = this.weaponLevel;

            this.wingmenSlots.forEach(slot => {
                if (slot.active) {
                    slot.active.updatePos(this.x, this.y);
                    if (slot.active.markedForDeletion) {
                        slot.active = null; 
                    }
                }
            });

            if (this.hp <= 0) isGameOver = true;
        }

        shoot() {
            const fireConfig = (offsetX, velocityY, velocityX = 0) => {
                projectiles.push(new Projectile(this.x + offsetX, this.y - this.height/2, velocityX, velocityY, '#00ffff'));
            };

            if (this.weaponLevel === 1) {
                fireConfig(0, -12);
            } else if (this.weaponLevel === 2) {
                fireConfig(-8, -12); fireConfig(8, -12);
            } else if (this.weaponLevel === 3) {
                fireConfig(0, -12); fireConfig(-15, -11, -2); fireConfig(15, -11, 2);
            } else {
                fireConfig(-12, -12); fireConfig(12, -12); 
                fireConfig(-20, -10, -3); fireConfig(20, -10, 3);
                fireConfig(0, -13);
            }
            
            this.wingmenSlots.forEach(slot => {
                if (slot.active) {
                    projectiles.push(new Projectile(slot.active.x, slot.active.y - 15, 0, -10, '#00ffaa'));
                }
            });
        }

        addWingman() {
            let emptySlot = this.wingmenSlots.find(s => s.active === null);
            if (emptySlot) {
                emptySlot.active = new Wingman(emptySlot.offset, emptySlot.y);
                emptySlot.active.x = this.x + emptySlot.offset;
                emptySlot.active.y = this.y + emptySlot.y;
            } else {
                score += 150; 
            }
        }
    }

    class Projectile {
        constructor(x, y, vx, vy, color) {
            this.x = x; this.y = y;
            this.vx = vx; this.vy = vy;
            this.color = color;
            this.radius = 4;
            this.markedForDeletion = false;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.y < -50 || this.x < -50 || this.x > canvas.width + 50) this.markedForDeletion = true;
        }
    }

    class Enemy extends Entity {
        constructor() {
            super(Math.random() * (canvas.width - 40) + 20, -50);
            this.width = 35;
            this.height = 35;
            
            // NEU: HIER IST DAS SPEED-LIMIT FÜR DIE GEGNER EINGEBAUT!
            const maxSpeed = 10;
            this.velocity = Math.min(maxSpeed, 2 + Math.random() * 3 + (score * 0.002));
            
            let hpScale = 20 + Math.floor(score / 50) * 10;
            this.hp = hpScale;
            this.maxHp = hpScale;
            this.shield = 0; 
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.beginPath();
            ctx.moveTo(0, this.height/2);
            ctx.lineTo(this.width/2, -this.height/2);
            ctx.lineTo(-this.width/2, -this.height/2);
            ctx.closePath();
            ctx.fillStyle = '#ff3333';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff3333';
            ctx.fill();
            ctx.restore();
        }
        update() {
            this.y += this.velocity;
            if (this.y > canvas.height + 50) this.markedForDeletion = true;
        }
    }

    class Perk {
        constructor() {
            this.radius = 18;
            this.x = Math.random() * (canvas.width - this.radius*2) + this.radius;
            this.y = -50;
            this.velocity = 2.5;
            this.markedForDeletion = false;
            
            const types = [
                { id: 'wingman', color: '#33ff33', symbol: '+' },
                { id: 'weapon', color: '#ff3333', symbol: 'W' },
                { id: 'shield', color: '#33aaff', symbol: 'S' },
                { id: 'health', color: '#ff33ff', symbol: 'H' }
            ];
            this.typeInfo = types[Math.floor(Math.random() * types.length)];
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            let scale = 1 + Math.sin(frameCount * 0.1) * 0.1;
            ctx.scale(scale, scale);

            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = this.typeInfo.color;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.typeInfo.color;
            ctx.stroke();
            
            ctx.fillStyle = this.typeInfo.color;
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.typeInfo.symbol, 0, 1);
            
            ctx.restore();
        }
        update() {
            this.y += this.velocity;
            if (this.y > canvas.height + 50) this.markedForDeletion = true;
        }
    }

    class Particle {
        constructor(x, y, color, speedMultiplier = 1) {
            this.x = x; this.y = y;
            this.velocity = { 
                x: (Math.random() - 0.5) * 10 * speedMultiplier, 
                y: (Math.random() - 0.5) * 10 * speedMultiplier 
            };
            this.color = color;
            this.life = 1.0;
            this.markedForDeletion = false;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.life;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
        update() {
            this.x += this.velocity.x;
            this.y += this.velocity.y;
            this.life -= 0.03;
            if (this.life <= 0) this.markedForDeletion = true;
        }
    }

    let player;

    function createParticles(x, y, color, amount = 15, speed = 1) {
        for (let i = 0; i < amount; i++) {
            particles.push(new Particle(x, y, color, speed));
        }
    }

    function checkCollision(obj1, obj2, threshold) {
        const dx = obj1.x - obj2.x;
        const dy = obj1.y - obj2.y;
        return Math.sqrt(dx * dx + dy * dy) < threshold;
    }

    function spawnEntities() {
        let spawnRate = Math.max(20, 70 - Math.floor(score / 100));
        if (frameCount % spawnRate === 0) enemies.push(new Enemy());
        if (frameCount % 300 === 0 && Math.random() > 0.2) perks.push(new Perk());
    }

    function init() {
        player = new Player();
        targetX = canvas.width / 2;
        projectiles = []; enemies = []; perks = []; particles = [];
        score = 0; frameCount = 0; isGameOver = false;
        
        scoreText.innerText = score;
        gameOverScreen.style.display = 'none';
        animate();
    }

    // --- NEU: HIER WURDE DIE ANIMATE FUNKTION KORREKT ZU ENDE GEFÜHRT ---
    function animate() {
        if (isGameOver) {
            finalScoreText.innerText = score;
            gameOverScreen.style.display = 'block';
            return;
        }

        ctx.fillStyle = 'rgba(0, 0, 20, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if(frameCount % 2 === 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(Math.random() * canvas.width, 0, 1, Math.random() * 5 + 2);
        }

        player.update();
        player.draw();

        spawnEntities();

        [...projectiles, ...enemies, ...perks, ...particles].forEach(entity => {
            entity.update();
            entity.draw();
        });

        // Kollision Projektile vs Gegner
        projectiles.forEach(p => {
            if (p.markedForDeletion) return;
            enemies.forEach(e => {
                if (!e.markedForDeletion && checkCollision(p, e, 25)) {
                    p.markedForDeletion = true;
                    e.takeDamage(10 + (player.weaponLevel * 2)); 
                    
                    if (e.markedForDeletion) {
                        score += 20;
                        scoreText.innerText = score;
                    } else {
                        createParticles(p.x, p.y, '#ffffff', 3, 0.5);
                    }
                }
            });
        });

        // Kollision Gegner vs Spieler & Wingmen
        enemies.forEach(e => {
            if (e.markedForDeletion) return;

            let hitSomething = false;

            player.wingmenSlots.forEach(slot => {
                if (!hitSomething && slot.active && !slot.active.markedForDeletion && checkCollision(e, slot.active, 30)) {
                    slot.active.takeDamage(40);
                    hitSomething = true;
                    e.markedForDeletion = true; // Gegner platzt beim Rammen des Wingmans
                    createParticles(e.x, e.y, '#ff3333', 15);
                }
            });

            if (!hitSomething && checkCollision(player, e, 30)) {
                e.m
