            const ty = mothership ? mothership.top : canvas.height;
            const desired = Math.atan2(ty - this.y, tx - this.x);
            let cur = Math.atan2(this.vy, this.vx);
            let diff = desired - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            cur += Math.max(-this.turn, Math.min(this.turn, diff));
            this.vx = Math.cos(cur) * this.speed;
            this.vy = Math.sin(cur) * this.speed;

            this.x += this.vx;
            this.y += this.vy;

            // Smoke trail
            if (frameCount % 2 === 0) {
                particles.push(new Particle(this.x - this.vx, this.y - this.vy, '#ffaa55', 0.4));
            }

            if (this.y > canvas.height + 60) this.markedForDeletion = true;
        }

        draw() {
            const angle = Math.atan2(this.vy, this.vx);
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(angle + Math.PI / 2);

            // Exhaust flame
            const flame = 10 + Math.sin(frameCount * 0.8) * 4;
            const fg = ctx.createLinearGradient(0, 10, 0, 10 + flame);
            fg.addColorStop(0, 'rgba(255,240,180,0.9)');
            fg.addColorStop(1, 'rgba(255,80,0,0)');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.moveTo(-4, 8);
            ctx.lineTo(0, 10 + flame);
            ctx.lineTo(4, 8);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff5500';

            // Warhead body
            ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#c02020';
            ctx.beginPath();
            ctx.moveTo(0, -14);
            ctx.lineTo(5, -4);
            ctx.lineTo(5, 8);
            ctx.lineTo(-5, 8);
            ctx.lineTo(-5, -4);
            ctx.closePath();
            ctx.fill();

            // Fins
            ctx.fillStyle = '#3a3a44';
            ctx.beginPath();
            ctx.moveTo(-5, 4); ctx.lineTo(-9, 10); ctx.lineTo(-5, 8); ctx.closePath();
            ctx.moveTo(5, 4); ctx.lineTo(9, 10); ctx.lineTo(5, 8); ctx.closePath();
            ctx.fill();

            // Warning tip
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffdd00';
            ctx.fillStyle = '#ffdd33';
            ctx.beginPath();
            ctx.arc(0, -12, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Threat HP pip
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(this.x - 12, this.y - 22, 24, 3);
            ctx.fillStyle = '#ffcc33';
            ctx.fillRect(this.x - 12, this.y - 22, 24 * (this.hp / this.maxHp), 3);
        }
    }

    let player;

    function createParticles(x, y, color, amount = 15, speed = 1) {
        for (let i = 0; i < amount; i++) {
            particles.push(new Particle(x, y, color, speed));
        }
    }

    function checkCollision(obj1, obj2, threshold) {
        const dx = obj1.x - obj2.x;
        const dy = obj1.y - obj2.y;
        return Math.sqrt(dx * dx + dy * dy) < threshold;
    }

    // --- SCREEN SHAKE ---
    function addShake(mag, time) {
        shakeMag = Math.max(shakeMag, mag);
        shakeTime = Math.max(shakeTime, time);
    }

    // --- WAVE BANNER ---
    let boss = null;
    function showBanner(main, sub) {
        waveBanner.innerHTML = main + (sub ? `<span class="sub">${sub}</span>` : '');
        waveBanner.style.opacity = '1';
        setTimeout(() => { waveBanner.style.opacity = '0'; }, 1600);
    }

    // --- WAVE SYSTEM ---
    function buildWaveQueue() {
        spawnQueue = [];
        let count = 16 + wave * 4;
        if (waveModifier === 'swarm') count = Math.round(count * 1.7);
        for (let i = 0; i < count; i++) {
            const pool = ['grunt'];
            if (wave >= 2) pool.push('kamikaze');
            if (wave >= 3) pool.push('shooter');
            if (wave >= 4) pool.push('bomber');
            const r = Math.random();
            let type;
            if (waveModifier === 'swarm') {
                type = r < 0.72 ? 'grunt' : 'kamikaze';
            } else if (waveModifier === 'elite') {
                if (r < 0.5 && wave >= 3) type = 'shooter';
                else if (r < 0.82 && wave >= 4) type = 'bomber';
                else type = 'grunt';
            } else {
                if (r < 0.45) type = 'grunt';
                else type = pool[Math.floor(Math.random() * pool.length)];
            }
            spawnQueue.push(type);
        }
    }

    function startWave() {
        wave++;
        waveText.innerText = wave;
        waveActive = true;

        // First boss at wave 6, then every 5 waves (6, 11, 16, ...)
        if (wave >= 6 && (wave - 6) % 5 === 0) {
            waveModifier = null;
            bossActive = true;
            boss = new Boss();
            showBanner('WARNUNG', 'Boss nähert sich!');
        } else {
            bossActive = false;
            waveModifier = null;
            if (wave >= 3 && Math.random() < 0.33) {
                const mods = ['swarm', 'armor', 'elite'];
                waveModifier = mods[Math.floor(Math.random() * mods.length)];
            }
            buildWaveQueue();
            const label = { swarm: 'Schwarm-Angriff!', armor: 'Panzer-Welle!', elite: 'Elite-Truppen!' }[waveModifier] || '';
            showBanner('WELLE ' + wave, label);
        }
        spawnTimer = 30;
    }

    function updateWaves() {
        if (bossActive) {
            if (boss && boss.markedForDeletion) {
                score += boss.scoreValue;
                scoreText.innerText = score;
                addXP(boss.xpValue);
                grantScrap(boss.scrapValue);
                boss = null;
                bossActive = false;
                waveActive = false;
                showBanner('BOSS BESIEGT', '+' + 500 + ' Punkte');
                openBuildPhase();
            }
            return;
        }

        // Normal wave: drip-spawn from queue
        if (spawnQueue.length > 0) {
            spawnTimer--;
            if (spawnTimer <= 0) {
                enemies.push(new Enemy(spawnQueue.shift()));
                spawnTimer = Math.max(24, 48 - wave * 1.5);
            }
        } else if (enemies.length === 0 && waveActive) {
            // Wave cleared -> build phase
            waveActive = false;
            openBuildPhase();
        }

        // Occasional support perks
        if (frameCount % 500 === 0 && Math.random() > 0.35) perks.push(new Perk());
    }

    // --- SCRAP ECONOMY ---
    function grantScrap(base) {
        const amount = Math.round(base * (1 + (player ? player.scrapBonus : 0)));
        scrap += amount;
        scrapText.innerText = scrap;
        if (isBuildPhase) bpScrapText.innerText = scrap;
    }

    function spend(cost) {
        if (scrap < cost) return false;
        scrap -= cost;
        scrapText.innerText = scrap;
        bpScrapText.innerText = scrap;
        return true;
    }

    // --- XP / LEVEL SYSTEM ---
    function updateXpUi() {
        xpBar.style.width = `${Math.min(100, (xp / xpToNext) * 100)}%`;
        levelText.innerText = level;
    }

    function addXP(amount) {
        xp += amount * player.xpMultiplier;
        while (xp >= xpToNext) {
            xp -= xpToNext;
            level++;
            xpToNext = Math.round(xpToNext * 1.35 + 3);
            grantScrap(15); // level-up scrap bonus
            showBanner('LEVEL ' + level, 'Neue Bauoptionen freigeschaltet');
        }
        updateXpUi();
    }

    // --- BUILD PHASE SHOP ---
    const TURRET_BUILD_COST = { gun: 90, flak: 130, rail: 160, slow: 120 };
    const TURRET_UPGRADE_COST = (lvl) => 60 + lvl * 55;
    const SHIELD_INSTALL_COST = 140;
    const SHIELD_UPGRADE_COST = 110;

    function shopCard({ icon, name, desc, cost, state, onBuy }) {
        const card = document.createElement('div');
        card.className = 'shop-item ' + state;
        let costHtml;
        if (state === 'max') costHtml = '<span class="si-cost max">MAX</span>';
        else if (state === 'locked') costHtml = `<span class="si-cost locked">🔒 ${cost}</span>`;
        else costHtml = `<span class="si-cost">⚙ ${cost}</span>`;
        card.innerHTML = `<div class="si-top"><span class="si-ic">${icon}</span>${name}</div>
            <div class="si-desc">${desc}</div>${costHtml}`;
        if (state === 'affordable') {
            // Only buy on a real tap: if the finger moved (scrolling), cancel.
            let sx = 0, sy = 0, moved = false;
            card.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                sx = t.clientX; sy = t.clientY; moved = false;
            }, { passive: true });
            card.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) moved = true;
            }, { passive: true });
            card.addEventListener('touchend', (e) => {
                if (!moved) { e.preventDefault(); onBuy(); } // preventDefault blocks the synthetic click
            }, { passive: false });
            card.addEventListener('click', () => onBuy());
        }
        return card;
    }

    function afterBuy() {
        updateControlBar();
        renderShop();
    }

    function renderShop() {
        shopScroll.innerHTML = '';
        const addCat = (title, items) => {
            if (!items.length) return;
            const h = document.createElement('div');
            h.className = 'shop-cat';
            h.innerText = title;
            shopScroll.appendChild(h);
            const grid = document.createElement('div');
            grid.className = 'shop-grid';
            items.forEach(c => grid.appendChild(c));
            shopScroll.appendChild(grid);
        };

        // WEAPONS
        const weaponCards = WEAPON_ORDER.map(id => {
            const def = WEAPONS[id];
            const w = player.weapons[id];
            if (!w.owned) {
                const locked = level < def.unlockLevel;
                const cost = def.buyCost;
                const state = locked ? 'locked' : (scrap >= cost ? 'affordable' : 'disabled');
                return shopCard({
                    icon: def.icon, name: def.name, desc: def.desc,
                    cost: locked ? ('Lvl ' + def.unlockLevel) : cost, state,
                    onBuy: () => { if (spend(cost)) { w.owned = true; player.currentWeapon = id; afterBuy(); } }
                });
            } else if (w.level >= def.maxLevel) {
                return shopCard({ icon: def.icon, name: def.name + ' Lv' + w.level, desc: def.desc, cost: 0, state: 'max' });
            }
            const cost = def.upgradeCost(w.level);
            const state = scrap >= cost ? 'affordable' : 'disabled';
            return shopCard({
                icon: def.icon, name: def.name + ' Lv' + w.level, desc: 'Upgrade auf Lv' + (w.level + 1), cost, state,
                onBuy: () => { if (spend(cost)) { w.level++; afterBuy(); } }
            });
        });
        addCat('WAFFEN', weaponCards);

        // ABILITIES
        const abilityCards = ABILITY_ORDER.map(id => {
            const def = ABILITIES[id];
            const a = player.abilities[id];
            if (a.owned) return shopCard({ icon: def.icon, name: def.name, desc: def.desc, cost: 0, state: 'max' });
            const locked = level < def.unlockLevel;
            const cost = def.buyCost;
            const state = locked ? 'locked' : (scrap >= cost ? 'affordable' : 'disabled');
            return shopCard({
                icon: def.icon, name: def.name, desc: def.desc,
                cost: locked ? ('Lvl ' + def.unlockLevel) : cost, state,
                onBuy: () => { if (spend(cost)) { a.owned = true; afterBuy(); } }
            });
        });
        addCat('FÄHIGKEITEN', abilityCards);

        // SHIP MODULES
        const moduleCards = MODULES.map(m => {
            const tier = player.moduleTiers[m.id];
            if (tier >= m.max) return shopCard({ icon: m.icon, name: m.name + ' Lv' + tier, desc: m.desc, cost: 0, state: 'max' });
            const cost = m.cost(tier);
            const state = scrap >= cost ? 'affordable' : 'disabled';
            return shopCard({
                icon: m.icon, name: m.name + (tier ? ' Lv' + tier : ''), desc: m.desc, cost, state,
                onBuy: () => { if (spend(cost)) { m.apply(player); player.moduleTiers[m.id]++; afterBuy(); } }
            });
        });
        addCat('SCHIFF-MODULE', moduleCards);

        // MOTHERSHIP & DEFENSE
        const defenseCards = [];
        if (mothership.maxShield === 0) {
            const cost = SHIELD_INSTALL_COST;
            const state = scrap >= cost ? 'affordable' : 'disabled';
            defenseCards.push(shopCard({
                icon: '🔷', name: 'Schildgenerator', desc: 'Regenerierender Schutzschild fürs Mutterschiff.', cost, state,
                onBuy: () => { if (spend(cost)) { mothership.installShield(); afterBuy(); } }
            }));
        } else {
            const cost = SHIELD_UPGRADE_COST;
            const state = scrap >= cost ? 'affordable' : 'disabled';
            defenseCards.push(shopCard({
                icon: '🔵', name: 'Schild verstärken', desc: '+120 Kapazität & schnellere Regeneration.', cost, state,
                onBuy: () => { if (spend(cost)) { mothership.maxShield += 120; mothership.shield = mothership.maxShield; mothership.shieldRegen += 0.1; afterBuy(); } }
            }));
        }
        if (mothership.hp < mothership.maxHp) {
            const cost = 80;
            const state = scrap >= cost ? 'affordable' : 'disabled';
            defenseCards.push(shopCard({
                icon: '🔧', name: 'Mutterschiff reparieren', desc: '+150 HP fürs Mutterschiff.', cost, state,
                onBuy: () => { if (spend(cost)) { mothership.hp = Math.min(mothership.maxHp, mothership.hp + 150); afterBuy(); } }
            }));
        }
        if (mothership.freeTurretSlot) {
            Object.keys(TURRET_TYPES).forEach(type => {
                const def = TURRET_TYPES[type];
                const cost = TURRET_BUILD_COST[type];
                const state = scrap >= cost ? 'affordable' : 'disabled';
                defenseCards.push(shopCard({
                    icon: def.icon, name: def.name + ' bauen', desc: def.desc, cost, state,
                    onBuy: () => { if (spend(cost)) { mothership.addTurret(type); afterBuy(); } }
                }));
            });
        }
        if (mothership.upgradableTurret) {
            const t = mothership.upgradableTurret;
            const cost = TURRET_UPGRADE_COST(t.level);
            const state = scrap >= cost ? 'affordable' : 'disabled';
            defenseCards.push(shopCard({
                icon: '⬆️', name: 'Turm aufrüsten', desc: 'Verbessert den schwächsten Abwehrturm.', cost, state,
                onBuy: () => { if (spend(cost)) { mothership.upgradeTurret(); afterBuy(); } }
            }));
        }
        if (player.wingmenSlots.some(s => !s.active)) {
            const cost = 130;
            const state = scrap >= cost ? 'affordable' : 'disabled';
            defenseCards.push(shopCard({
                icon: '🤝', name: 'Flügelmann', desc: 'Ein Begleitjäger unterstützt dein Schiff.', cost, state,
                onBuy: () => { if (spend(cost)) { player.addWingman(); afterBuy(); } }
            }));
        }
        addCat('MUTTERSCHIFF & VERTEIDIGUNG', defenseCards);
    }

    function openBuildPhase(pauseMode = false) {
        pauseShop = pauseMode;
        isBuildPhase = true;
        isPaused = true;
        bpScrapText.innerText = scrap;
        if (pauseMode) {
            bpSub.innerText = 'Pause – kaufe & rüste auf';
            startWaveBtn.innerText = 'FORTSETZEN';
            pauseBtn.innerText = '▶';
        } else {
            bpSub.innerText = 'Bereite dich auf Welle ' + (wave + 1) + ' vor';
            startWaveBtn.innerText = 'WELLE STARTEN';
            pauseBtn.innerText = '⏸';
        }
        renderShop();
        buildPhaseScreen.style.display = 'flex';
    }

    function closeBuildPhase() {
        buildPhaseScreen.style.display = 'none';
        isBuildPhase = false;
        isPaused = false;
        pauseBtn.innerText = '⏸';
        if (pauseShop) {
            // Opened via pause mid-wave -> just resume, no new wave
            pauseShop = false;
        } else {
            startWave();
        }
    }
    startWaveBtn.addEventListener('click', (e) => { if (e) e.preventDefault(); if (isBuildPhase) closeBuildPhase(); });
    startWaveBtn.addEventListener('touchstart', (e) => { if (e) e.preventDefault(); if (isBuildPhase) closeBuildPhase(); }, { passive: false });

    // --- BACKGROUND SYSTEM ---
    function pickStarColor() {
        const r = Math.random();
        if (r < 0.7) return '255,255,255';        // white
        if (r < 0.85) return '170,200,255';       // blue-ish
        if (r < 0.95) return '255,220,170';        // warm
        return '255,170,210';                      // pink
    }

    function initBackground() {
        bgStars = [];
        bgPlanets = [];
        bgShips = [];

        // Three parallax star layers (far -> near)
        const layers = [
            { count: 70, speed: 0.25, min: 0.4, max: 1.0, alpha: 0.5 },
            { count: 45, speed: 0.6,  min: 0.8, max: 1.6, alpha: 0.75 },
            { count: 22, speed: 1.2,  min: 1.3, max: 2.4, alpha: 1.0 }
        ];
        layers.forEach(l => {
            for (let i = 0; i < l.count; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: l.min + Math.random() * (l.max - l.min),
                    speed: l.speed,
                    alpha: l.alpha,
                    twinkle: Math.random() * Math.PI * 2,
                    color: pickStarColor()
                });
            }
        });

        // Sometimes start with a planet already on screen
        if (Math.random() > 0.5) spawnPlanet(-Math.random() * canvas.height);
    }

    function spawnPlanet(startY) {
        const palettes = [
            ['#3a5a8c', '#0a1830'], // blue
            ['#8c5a3a', '#301608'], // rust
            ['#5a8c6a', '#0a2018'], // green
            ['#8c3a6a', '#300818'], // magenta
            ['#a08040', '#282010']  // sandy
        ];
        const pal = palettes[Math.floor(Math.random() * palettes.length)];
        const radius = 40 + Math.random() * 80;
        bgPlanets.push({
            x: Math.random() * canvas.width,
            y: startY !== undefined ? startY : -radius - Math.random() * 200,
            radius: radius,
            speed: 0.15 + Math.random() * 0.25,
            colorLight: pal[0],
            colorDark: pal[1],
            hasRing: Math.random() > 0.6,
            ringTilt: 0.2 + Math.random() * 0.4,
            lightAngle: Math.random() * Math.PI * 2,
            markedForDeletion: false
        });
    }

    function spawnCapitalShip() {
        const fromLeft = Math.random() > 0.5;
        const scale = 0.6 + Math.random() * 0.9; // "seen from far away" -> small-ish
        bgShips.push({
            x: fromLeft ? -160 : canvas.width + 160,
            y: 50 + Math.random() * (canvas.height * 0.45),
            vx: (fromLeft ? 1 : -1) * (0.2 + Math.random() * 0.3),
            vy: 0.04 + Math.random() * 0.1,
            scale: scale,
            dir: fromLeft ? 1 : -1,
            markedForDeletion: false
        });
    }

    function updateBackground() {
        // Stars scroll down and wrap around
        bgStars.forEach(s => {
            s.y += s.speed;
            s.twinkle += 0.05;
            if (s.y > canvas.height + 2) {
                s.y = -2;
                s.x = Math.random() * canvas.width;
            }
        });

        // Occasionally spawn a drifting planet
        if (bgPlanets.length < 2 && Math.random() < 0.0025) spawnPlanet();
        bgPlanets.forEach(p => {
            p.y += p.speed;
            if (p.y - p.radius > canvas.height + 40) p.markedForDeletion = true;
        });
        bgPlanets = bgPlanets.filter(p => !p.markedForDeletion);

        // Rare distant capital ships crossing by
        if (bgShips.length < 1 && Math.random() < 0.0016) spawnCapitalShip();
        bgShips.forEach(s => {
            s.x += s.vx;
            s.y += s.vy;
            if (s.x < -240 || s.x > canvas.width + 240 || s.y > canvas.height + 120) s.markedForDeletion = true;
        });
        bgShips = bgShips.filter(s => !s.markedForDeletion);
    }

    function drawBackground() {
        // Deep space gradient (opaque redraw)
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, '#02010a');
        g.addColorStop(0.5, '#050320');
        g.addColorStop(1, '#0a0518');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle nebula glow patches
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const nb1 = ctx.createRadialGradient(canvas.width * 0.2, canvas.height * 0.3, 0, canvas.width * 0.2, canvas.height * 0.3, canvas.width * 0.5);
        nb1.addColorStop(0, 'rgba(40, 20, 80, 0.25)');
        nb1.addColorStop(1, 'rgba(40, 20, 80, 0)');
        ctx.fillStyle = nb1;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const nb2 = ctx.createRadialGradient(canvas.width * 0.8, canvas.height * 0.7, 0, canvas.width * 0.8, canvas.height * 0.7, canvas.width * 0.5);
        nb2.addColorStop(0, 'rgba(10, 40, 70, 0.2)');
        nb2.addColorStop(1, 'rgba(10, 40, 70, 0)');
        ctx.fillStyle = nb2;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();

        // Planets (far background)
        bgPlanets.forEach(drawPlanet);

        // Distant capital ships
        bgShips.forEach(drawCapitalShip);

        // Stars with twinkle (in front of planets/ships)
        bgStars.forEach(s => {
            const tw = 0.7 + Math.sin(s.twinkle) * 0.3;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${s.color}, ${s.alpha * tw})`;
            if (s.r > 1.6) {
                ctx.shadowBlur = 6;
                ctx.shadowColor = `rgba(${s.color}, 0.8)`;
            }
            ctx.fill();
            ctx.shadowBlur = 0;
        });
    }

    function drawPlanet(p) {
        ctx.save();
        ctx.translate(p.x, p.y);

        // Atmosphere halo
        const halo = ctx.createRadialGradient(0, 0, p.radius * 0.9, 0, 0, p.radius * 1.3);
        halo.addColorStop(0, p.colorLight + '55');
        halo.addColorStop(1, p.colorLight + '00');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(0, 0, p.radius * 1.3, 0, Math.PI * 2);
        ctx.fill();

        // Ring behind
        if (p.hasRing) {
            ctx.save();
            ctx.rotate(-0.4);
            ctx.scale(1, p.ringTilt);
            ctx.strokeStyle = p.colorLight + '99';
            ctx.lineWidth = p.radius * 0.14;
            ctx.beginPath();
            ctx.arc(0, 0, p.radius * 1.55, Math.PI, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        // Planet body with day/night shading
        const lx = Math.cos(p.lightAngle) * p.radius * 0.5;
        const ly = Math.sin(p.lightAngle) * p.radius * 0.5;
        const body = ctx.createRadialGradient(lx, ly, p.radius * 0.1, 0, 0, p.radius);
        body.addColorStop(0, p.colorLight);
        body.addColorStop(0.7, p.colorDark);
        body.addColorStop(1, '#000000');
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
        ctx.fill();

        // Ring front
        if (p.hasRing) {
            ctx.save();
            ctx.rotate(-0.4);
            ctx.scale(1, p.ringTilt);
            ctx.strokeStyle = p.colorLight + 'cc';
            ctx.lineWidth = p.radius * 0.14;
            ctx.beginPath();
            ctx.arc(0, 0, p.radius * 1.55, 0, Math.PI);
            ctx.stroke();
            ctx.restore();
        }

        ctx.restore();
    }

    function drawCapitalShip(s) {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.scale(s.scale * s.dir, s.scale);
        ctx.globalAlpha = 0.85;

        // Engine glow at the rear
        const eng = ctx.createRadialGradient(-95, 0, 0, -95, 0, 30);
        eng.addColorStop(0, 'rgba(120,200,255,0.9)');
        eng.addColorStop(1, 'rgba(120,200,255,0)');
        ctx.fillStyle = eng;
        ctx.beginPath();
        ctx.arc(-95, 0, 30, 0, Math.PI * 2);
        ctx.fill();

        // Main hull (dark elongated silhouette)
        const hull = ctx.createLinearGradient(0, -22, 0, 22);
        hull.addColorStop(0, '#3a4152');
        hull.addColorStop(0.5, '#1a1f2b');
        hull.addColorStop(1, '#080a12');
        ctx.fillStyle = hull;
        ctx.beginPath();
        ctx.moveTo(120, 0);          // nose
        ctx.lineTo(70, -14);
        ctx.lineTo(-80, -18);
        ctx.lineTo(-95, -8);
        ctx.lineTo(-95, 8);
        ctx.lineTo(-80, 18);
        ctx.lineTo(70, 14);
        ctx.closePath();
        ctx.fill();

        // Superstructure / command tower
        ctx.fillStyle = '#2a3040';
        ctx.beginPath();
        ctx.moveTo(-10, -18);
        ctx.lineTo(20, -34);
        ctx.lineTo(35, -34);
        ctx.lineTo(30, -18);
        ctx.closePath();
        ctx.fill();

        // Window / running lights
        ctx.fillStyle = 'rgba(255,220,120,0.9)';
        for (let i = -70; i < 100; i += 12) {
            if (Math.sin(i * 12.9898 + s.y) > -0.6) ctx.fillRect(i, -4, 3, 2);
        }
        ctx.fillStyle = 'rgba(255,80,80,0.9)';
        ctx.fillRect(115, -1, 3, 2); // red nose beacon

        ctx.restore();
        ctx.globalAlpha = 1;
    }

    function init() {
        player = new Player();
        mothership = new Mothership();
        targetX = canvas.width / 2;
        projectiles = []; enemies = []; enemyProjectiles = []; missiles = []; perks = []; particles = [];
        score = 0; frameCount = 0; isGameOver = false; isPaused = false;

        // Pause reset
        pauseShop = false;
        pauseOverlay.style.display = 'none';
        pauseBtn.innerText = '⏸';

        // Level / XP reset
        level = 1; xp = 0; xpToNext = 5;

        // Economy reset
        scrap = 200; waveModifier = null; isBuildPhase = false;

        // Wave reset
        wave = 0; spawnQueue = []; spawnTimer = 0;
        waveActive = false; waveBreakTimer = 60; bossActive = false; boss = null;

        shakeTime = 0; shakeMag = 0;

        initBackground();
        buildControlBar();

        scoreText.innerText = score;
        scrapText.innerText = scrap;
        updateXpUi();
        waveText.innerText = wave;
        mothershipBar.style.width = '100%';
        mothershipShieldWrap.style.display = 'none';
        gameOverScreen.style.display = 'none';
        levelUpScreen.style.display = 'none';
        buildPhaseScreen.style.display = 'none';
        openBuildPhase();
        animate();
    }

    function animate() {
        if (isGameOver) {
            finalScoreText.innerText = score;
            gameOverScreen.style.display = 'block';
            return;
        }

        requestAnimationFrame(animate);

        // --- UPDATE PHASE (skipped while paused for level-up) ---
        if (!isPaused) {
            updateBackground();
            mothership.update();
            player.update();
            updateWaves();
            if (boss) boss.update();

            [...projectiles, ...enemyProjectiles, ...missiles, ...enemies, ...perks, ...particles].forEach(e => e.update());

            // Player projectiles vs enemies
            const dmg = 10 + player.damageBonus; // fallback for wingmen shots
            projectiles.forEach(p => {
                if (p.markedForDeletion) return;
                const pdmg = (p.damage != null) ? p.damage : dmg;

                // vs missiles (intercept threat)
                missiles.forEach(m => {
                    if (!m.markedForDeletion && checkCollision(p, m, m.radius + 6)) {
                        if (!p.piercing) p.markedForDeletion = true;
                        m.takeDamage(pdmg);
                        if (m.markedForDeletion) {
                            score += m.scoreValue;
                            scoreText.innerText = score;
                            grantScrap(10);
                        }
                    }
                });

                enemies.forEach(e => {
                    if (!e.markedForDeletion && checkCollision(p, e, (e.width + e.height) / 4 + 6)) {
                        if (!p.piercing) p.markedForDeletion = true;
                        if (p.slow) e.slowTimer = 200;
                        const mult = damageMultiplier(p.dtype, e.armorClass);
                        e.takeDamage(pdmg * mult);
                        // Feedback: golden spark = extra effective, grey = resisted
                        if (mult >= 1.3) createParticles(p.x, p.y, '#ffee66', 5, 0.9);
                        else if (mult <= 0.7) createParticles(p.x, p.y, '#8899aa', 4, 0.4);
                        if (e.markedForDeletion) {
                            score += e.scoreValue;
                            scoreText.innerText = score;
                            addXP(e.xpValue);
                            grantScrap(e.scrapValue);
                        } else {
                            createParticles(p.x, p.y, '#ffffff', 3, 0.5);
                        }
                    }
                });

                // Player projectiles vs boss
                if (boss && !boss.markedForDeletion && checkCollision(p, boss, boss.width * 0.42)) {
                    if (!p.piercing) p.markedForDeletion = true;
                    if (p.slow) boss.slowTimer = 120;
                    boss.takeDamage(pdmg);
                    createParticles(p.x, p.y, '#ffcc00', 3, 0.6);
                }
            });

            // Enemies vs player / wingmen / mothership
            enemies.forEach(e => {
                if (e.markedForDeletion) return;
                let consumed = false;

                // Reached the mothership defense line
                if (e.y > mothership.top) {
                    mothership.takeDamage(e.ramDamage);
                    e.markedForDeletion = true;
                    createParticles(e.x, e.y, '#ff6600', 18, 1.5);
                    return;
                }

                player.wingmenSlots.forEach(slot => {
                    if (!consumed && slot.active && !slot.active.markedForDeletion && checkCollision(e, slot.active, 30)) {
                        slot.active.takeDamage(40);
                        consumed = true;
                        e.markedForDeletion = true;
                        createParticles(e.x, e.y, '#ff3333', 15);
                    }
                });

                if (!consumed && checkCollision(player, e, 30)) {
                    e.markedForDeletion = true;
                    player.takeDamage(e.ramDamage);
                    createParticles(e.x, e.y, '#ff3333', 15);
                }
            });

            // Enemy projectiles vs mothership / player
            enemyProjectiles.forEach(ep => {
                if (ep.markedForDeletion) return;
                if (ep.y > mothership.top) {
                    mothership.takeDamage(ep.damage);
                    ep.markedForDeletion = true;
                    return;
                }
                if (checkCollision(ep, player, 26)) {
                    player.takeDamage(ep.damage);
                    ep.markedForDeletion = true;
                    createParticles(ep.x, ep.y, '#ff5555', 6, 1);
                }
            });

            // Missiles vs mothership / player
            missiles.forEach(m => {
                if (m.markedForDeletion) return;
                if (m.y > mothership.top) {
                    mothership.takeDamage(m.damage);
                    m.explode();
                    return;
                }
                if (checkCollision(m, player, 28)) {
                    player.takeDamage(m.damage);
                    m.explode();
                }
            });

            // Boss body vs player
            if (boss && !boss.markedForDeletion && checkCollision(player, boss, boss.width * 0.38)) {
                player.takeDamage(30);
            }

            // Player vs perks
            perks.forEach(p => {
                if (!p.markedForDeletion && checkCollision(p, player, 35)) {
                    p.markedForDeletion = true;
                    if (p.typeInfo.id === 'weapon') grantScrap(40);
                    if (p.typeInfo.id === 'health') player.hp = Math.min(player.maxHp, player.hp + 30);
                    if (p.typeInfo.id === 'shield') player.shield = Math.min(player.maxShield, player.shield + 50);
                    if (p.typeInfo.id === 'wingman') player.addWingman();
                    score += 50;
                    scoreText.innerText = score;
                    createParticles(p.x, p.y, p.typeInfo.color, 20, 2);
                }
            });

            // Cleanup
            projectiles = projectiles.filter(p => !p.markedForDeletion);
            enemyProjectiles = enemyProjectiles.filter(p => !p.markedForDeletion);
            missiles = missiles.filter(m => !m.markedForDeletion);
            enemies = enemies.filter(e => !e.markedForDeletion);
            perks = perks.filter(p => !p.markedForDeletion);
            particles = particles.filter(p => !p.markedForDeletion);

            frameCount++;
        }

        // --- RENDER PHASE (always, so the frozen scene shows behind overlays) ---
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let ox = 0, oy = 0;
        if (shakeTime > 0) {
            ox = (Math.random() - 0.5) * shakeMag;
            oy = (Math.random() - 0.5) * shakeMag;
            shakeTime--;
            if (shakeTime === 0) shakeMag = 0;
        }

        ctx.save();
        ctx.translate(ox, oy);

        drawBackground();
        mothership.draw();
        perks.forEach(p => p.draw());
        particles.forEach(p => p.draw());
        enemyProjectiles.forEach(p => p.draw());
        enemies.forEach(e => e.draw());
        missiles.forEach(m => m.draw());
        projectiles.forEach(p => p.draw());
        if (boss) boss.draw();
        player.draw();

        ctx.restore();
    }

    init();
</script>
