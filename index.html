<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibe Squadron - Touch & Upgrades</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            width: 100%;
            max-width: 500px;
            height: 100vh;
            height: 100dvh; /* dynamic viewport: excludes mobile browser chrome */
            max-height: 850px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #00001a, #000033);
            touch-action: none;
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        .stats {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bar-container {
            width: 100px;
            height: 10px;
            background: #333;
            border: 1px solid #fff;
            border-radius: 5px;
            overflow: hidden;
        }
        #hpBar { height: 100%; background: #ff3333; width: 100%; transition: width 0.2s; }
        #shieldBar { height: 100%; background: #33aaff; width: 100%; transition: width 0.2s; }
        #xpBar { height: 100%; background: linear-gradient(90deg, #ffcc33, #ffff88); width: 0%; transition: width 0.2s; }

        /* Mothership integrity bar (top center) */
        #mothershipUi {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 280px;
            text-align: center;
            pointer-events: none;
        }
        #mothershipUi .label {
            font-size: 12px;
            letter-spacing: 2px;
            color: #ffcc66;
            text-shadow: 0 0 6px #ff8800;
            margin-bottom: 3px;
        }
        .big-bar-container {
            width: 100%;
            height: 14px;
            background: #300;
            border: 1px solid #ffaa33;
            border-radius: 7px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(255, 150, 0, 0.5);
        }
        #mothershipBar {
            height: 100%;
            background: linear-gradient(90deg, #ff6600, #ffcc00);
            width: 100%;
            transition: width 0.2s;
        }
        .big-bar-container.shield {
            height: 8px;
            margin-top: 3px;
            border-color: #33ccff;
            box-shadow: 0 0 10px rgba(0, 180, 255, 0.5);
            background: #012;
        }
        #mothershipShieldBar {
            height: 100%;
            background: linear-gradient(90deg, #0099ff, #66eaff);
            width: 100%;
            transition: width 0.15s;
        }

        /* XP + level row */
        .xp-row { margin-top: 8px; }
        .xp-bar-container {
            width: 120px;
            height: 8px;
            background: #222;
            border: 1px solid #ffcc33;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Wave banner */
        #waveBanner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 34px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #00ffff, 0 0 8px #ffffff;
            opacity: 0;
            pointer-events: none;
            text-align: center;
            transition: opacity 0.4s;
            white-space: nowrap;
        }
        #waveBanner .sub {
            display: block;
            font-size: 16px;
            color: #ffcc66;
            text-shadow: 0 0 10px #ff8800;
            margin-top: 6px;
        }

        /* Level-up overlay */
        #levelUp {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 10, 0.82);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        #levelUp h2 {
            color: #ffcc33;
            text-shadow: 0 0 14px #ff8800;
            margin: 0 0 4px 0;
            letter-spacing: 2px;
        }
        #levelUp p { margin: 0 0 20px 0; color: #aef7ff; }
        .card-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 82%;
            max-width: 360px;
        }
        .upgrade-card {
            background: rgba(0, 20, 30, 0.9);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.15);
            touch-action: manipulation;
        }
        .upgrade-card:hover, .upgrade-card:active {
            background: rgba(0, 255, 255, 0.15);
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        .upgrade-card .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #00ffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .upgrade-card .card-icon { font-size: 22px; }
        .upgrade-card .card-desc {
            font-size: 13px;
            color: #cfefff;
            margin-top: 5px;
        }

        /* Scrap currency chip */
        #scrapChip {
            color: #ffdd66;
            font-size: 15px;
            margin-top: 6px;
            text-shadow: 0 0 6px #aa7700;
        }
        #scrapChip .coin { font-size: 13px; }

        /* --- Bottom control bar (weapons + abilities) --- */
        #controlBar {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 6px;
            padding: 6px 8px 8px;
            box-sizing: border-box;
            background: linear-gradient(to top, rgba(0,4,12,0.72), rgba(0,4,12,0));
            z-index: 15;
            pointer-events: none; /* only children capture */
            -webkit-user-select: none;
            user-select: none;
        }
        #weaponBar, #abilityBar {
            display: flex;
            gap: 6px;
            pointer-events: auto;
        }
        .ctrl-btn {
            position: relative;
            width: 54px;
            height: 54px;
            border-radius: 12px;
            border: 2px solid rgba(0,255,255,0.5);
            background: rgba(0,20,30,0.78);
            color: #cfefff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.08s, border-color 0.15s, box-shadow 0.15s;
            overflow: hidden;
        }
        .ctrl-btn .ic { font-size: 22px; line-height: 1; }
        .ctrl-btn .lvl {
            font-size: 10px;
            color: #ffdd66;
            margin-top: 2px;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        .ctrl-btn.locked { opacity: 0.28; }
        .weapon-btn.selected {
            border-color: #ffee44;
            box-shadow: 0 0 14px rgba(255,230,60,0.7), inset 0 0 10px rgba(255,230,60,0.25);
            background: rgba(40,40,10,0.85);
        }
        .ability-btn { border-color: rgba(255,140,60,0.6); }
        /* cooldown sweep overlay */        .ctrl-btn .cd {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .ctrl-btn .cd-txt {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #fff;
            pointer-events: none;
        }

        /* --- Pause button + overlay --- */
        #pauseBtn {
            position: absolute;
            top: 84px;
            right: 12px;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 2px solid rgba(0,255,255,0.5);
            background: rgba(0,20,30,0.8);
            color: #cfefff;
            font-size: 20px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            z-index: 30;
            transition: transform 0.08s, box-shadow 0.15s;
        }
        #pauseBtn:active { transform: scale(0.9); }
        #pauseBtn:hover { box-shadow: 0 0 12px rgba(0,255,255,0.5); }
        #pauseOverlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 6, 16, 0.6);
            z-index: 20;
            letter-spacing: 4px;
        }
        #pauseOverlay .pause-title {
            font-size: 40px;
            font-weight: bold;
            color: #7affea;
            text-shadow: 0 0 18px rgba(0,255,220,0.6);
        }
        #pauseOverlay .pause-hint {
            margin-top: 12px;
            font-size: 14px;
            letter-spacing: 1px;
            color: #9fc7d6;
        }

        /* --- Build phase shop --- */
        #buildPhase {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 4, 14, 0.92);
            display: none;
            flex-direction: column;
            z-index: 25;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
            box-sizing: border-box;
            overflow: hidden;
        }
        #buildPhase .bp-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #buildPhase .bp-title {
            font-size: 20px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 12px #00aaff;
            letter-spacing: 1px;
        }
        #buildPhase .bp-scrap {
            font-size: 18px;
            font-weight: bold;
            color: #ffdd66;
            text-shadow: 0 0 8px #aa7700;
        }
        #buildPhase .bp-sub {
            font-size: 13px;
            color: #ff9966;
            margin: 2px 0 8px;
            flex-shrink: 0;
        }
        #shopScroll {
            flex: 1;
            min-height: 0; /* allow the button below to stay visible in flex column */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding-right: 6px;
            scrollbar-width: thick;
            scrollbar-color: #00aaff rgba(0, 40, 60, 0.4);
        }
        /* Wide, easy-to-grab scrollbar on touch devices */
        #shopScroll::-webkit-scrollbar {
            width: 14px;
        }
        #shopScroll::-webkit-scrollbar-track {
            background: rgba(0, 40, 60, 0.4);
            border-radius: 7px;
        }
        #shopScroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00ccff, #0077aa);
            border-radius: 7px;
            border: 2px solid rgba(0, 20, 30, 0.6);
        }
        .shop-cat {
            font-size: 12px;
            letter-spacing: 2px;
            color: #66ccff;
            margin: 26px 2px 8px;
            padding: 8px 2px 6px;
            border-bottom: 1px solid rgba(0,150,255,0.25);
        }
        .shop-cat:first-child { margin-top: 6px; }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }
        .shop-item {
            background: rgba(0, 22, 34, 0.9);
            border: 1.5px solid rgba(0,200,255,0.4);
            border-radius: 10px;
            padding: 9px 10px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.08s, box-shadow 0.15s, border-color 0.15s;
        }
        .shop-item:active { transform: scale(0.97); }
        .shop-item.affordable:hover { box-shadow: 0 0 12px rgba(0,255,255,0.35); }
        .shop-item.disabled { opacity: 0.4; cursor: default; }
        .shop-item .si-top {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #aef7ff;
            font-size: 14px;
        }
        .shop-item .si-ic { font-size: 20px; }
        .shop-item .si-desc { font-size: 11px; color: #bcd; margin: 4px 0 6px; min-height: 26px; }
        .shop-item .si-cost {
            font-size: 13px;
            font-weight: bold;
            color: #ffdd66;
        }
        .shop-item .si-cost.max { color: #66ff99; }
        .shop-item .si-cost.locked { color: #ff6688; }
        #startWaveBtn {
            flex-shrink: 0;
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0 0;
            padding: 16px 30px;
            background: #ffcc33;
            color: #000;
            border: 2px solid #ffcc33;
            border-radius: 10px;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(255, 204, 51, 0.5);
        }
        #startWaveBtn:hover, #startWaveBtn:active { background: #ffcc33; color: #000; }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid cyan;
            border-radius: 10px;
            display: none;
            width: 80%;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            padding: 12px 25px;
            background-color: transparent;
            color: cyan;
            border: 2px solid cyan;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        button:hover, button:active {
            background-color: cyan;
            color: black;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="500" height="850"></canvas>
        <div id="mothershipUi">
            <div class="label">MUTTERSCHIFF</div>
            <div class="big-bar-container"><div id="mothershipBar"></div></div>
            <div id="mothershipShieldWrap" class="big-bar-container shield" style="display:none;"><div id="mothershipShieldBar"></div></div>
        </div>
        <div id="ui">
            <div class="stats">
                <div style="color: #ff3333;">HP</div>
                <div class="bar-container"><div id="hpBar"></div></div>
                <div style="color: #33aaff; margin-top: 5px;">Schild</div>
                <div class="bar-container"><div id="shieldBar"></div></div>
                <div class="xp-row" style="color: #ffcc33;">Level <span id="levelText">1</span></div>
                <div class="xp-bar-container"><div id="xpBar"></div></div>
                <div id="scrapChip"><span class="coin">⚙</span> Schrott: <span id="scrapText">0</span></div>
            </div>
            <div style="text-align: right;">
                <div>Score: <span id="scoreText">0</span></div>
                <div style="color: #ffaa33; font-size: 14px; margin-top: 5px;">Waffe: <span id="weaponText">Blaster</span></div>
                <div style="color: #ff6688; font-size: 14px; margin-top: 5px;">Welle: <span id="waveText">1</span></div>
            </div>
        </div>
        <div id="waveBanner"></div>
        <div id="pauseBtn">⏸</div>
        <div id="pauseOverlay">
            <div class="pause-title">PAUSE</div>
            <div class="pause-hint">Tippen oder P zum Fortsetzen</div>
        </div>
        <div id="controlBar">
            <div id="weaponBar"></div>
            <div id="abilityBar"></div>
        </div>
        <div id="buildPhase">
            <div class="bp-head">
                <span class="bp-title">BAUPHASE</span>
                <span class="bp-scrap"><span style="font-size:14px;">⚙</span> <span id="bpScrapText">0</span></span>
            </div>
            <div class="bp-sub" id="bpSub">Nächste Welle</div>
            <div id="shopScroll"></div>
            <button id="startWaveBtn">WELLE STARTEN</button>
        </div>
        <div id="levelUp">
            <h2>LEVEL UP</h2>
            <p>Wähle ein Upgrade</p>
            <div class="card-row" id="cardRow"></div>
        </div>
        <div id="gameOver">
            <h2>MISSION FAILED</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">Neustart</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const scoreText = document.getElementById('scoreText');
    const weaponText = document.getElementById('weaponText');
    const hpBar = document.getElementById('hpBar');
    const shieldBar = document.getElementById('shieldBar');
    const gameOverScreen = document.getElementById('gameOver');
    const finalScoreText = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');

    const mothershipBar = document.getElementById('mothershipBar');
    const mothershipShieldWrap = document.getElementById('mothershipShieldWrap');
    const mothershipShieldBar = document.getElementById('mothershipShieldBar');
    const xpBar = document.getElementById('xpBar');
    const levelText = document.getElementById('levelText');
    const waveText = document.getElementById('waveText');
    const waveBanner = document.getElementById('waveBanner');
    const levelUpScreen = document.getElementById('levelUp');
    const cardRow = document.getElementById('cardRow');

    const scrapText = document.getElementById('scrapText');
    const weaponBar = document.getElementById('weaponBar');
    const abilityBar = document.getElementById('abilityBar');
    const buildPhaseScreen = document.getElementById('buildPhase');
    const bpScrapText = document.getElementById('bpScrapText');
    const bpSub = document.getElementById('bpSub');
    const shopScroll = document.getElementById('shopScroll');
    const startWaveBtn = document.getElementById('startWaveBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseOverlay = document.getElementById('pauseOverlay');

    let isGameOver = false;
    let isPaused = false;
    let isBuildPhase = false;
    let pauseShop = false;
    let score = 0;
    let scrap = 0;
    let frameCount = 0;
    let particles = [];
    let projectiles = [];
    let enemyProjectiles = [];
    let missiles = [];
    let enemies = [];
    let perks = [];
    let mothership = null;
    let waveModifier = null;

    // --- LEVEL / XP STATE ---
    let level = 1;
    let xp = 0;
    let xpToNext = 5;

    // --- WAVE STATE ---
    let wave = 0;
    let spawnQueue = [];      // list of enemy type strings still to spawn this wave
    let spawnTimer = 0;
    let waveActive = false;
    let waveBreakTimer = 0;
    let bossActive = false;

    // --- JUICE ---
    let shakeTime = 0;
    let shakeMag = 0;

    // --- BACKGROUND STATE ---
    let bgStars = [];
    let bgPlanets = [];
    let bgShips = [];

    // --- VERBESSERTE STEUERUNG ---
    let targetX = canvas.width / 2;

    function updatePosition(e) {
        if (isGameOver || isBuildPhase) return;
        
        if (e.type === 'touchmove' || e.type === 'touchstart') {
            e.preventDefault(); 
        }

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width; 
        
        let clientX;
        // Prefer touches that actually started on the canvas (ignores button taps)
        if (e.targetTouches && e.targetTouches.length > 0) {
            clientX = e.targetTouches[0].clientX;
        } else if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
        } else {
            clientX = e.clientX;
        }
        
        targetX = (clientX - rect.left) * scaleX;
    }

    canvas.addEventListener('touchstart', updatePosition, { passive: false });
    canvas.addEventListener('touchmove', updatePosition, { passive: false });
    canvas.addEventListener('mousemove', updatePosition);

    const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false, A: false, D: false };
    window.addEventListener('keydown', (e) => { 
        if (keys.hasOwnProperty(e.key)) {
            keys[e.key] = true; 
        }
        // Weapon hotkeys 1-4
        if (e.key >= '1' && e.key <= '4') selectWeaponByIndex(parseInt(e.key, 10) - 1);
        // Ability hotkeys
        if (e.key === 'q' || e.key === 'Q') useAbility('overdrive');
        if (e.key === 'e' || e.key === 'E') useAbility('emp');
        // Pause toggle
        if (e.key === 'p' || e.key === 'P') togglePause();
    });
    window.addEventListener('keyup', (e) => { 
        if (keys.hasOwnProperty(e.key)) {
            keys[e.key] = false; 
        }
    });

    // --- Pause toggle: opens the build/upgrade shop mid-wave ---
    function togglePause() {
        if (isGameOver) return;
        if (isBuildPhase) {
            // Only the pause-triggered shop can be closed via pause (resume);
            // the normal between-wave build phase is closed via "WELLE STARTEN".
            if (pauseShop) closeBuildPhase();
            return;
        }
        openBuildPhase(true);
    }
    pauseBtn.addEventListener('click', (e) => { e.preventDefault(); togglePause(); });
    pauseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); }, { passive: false });

    restartBtn.addEventListener('click', () => init());
    restartBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        init();
    });

    // =====================================================================
    //  GAME DATA: WEAPONS / ABILITIES / MODULES
    // =====================================================================
    function spawnPlayerShot(x, y, vx, vy, color, damage, opts = {}) {
        const p = new Projectile(x, y, vx, vy, color, damage);
        if (opts.piercing) p.piercing = true;
        if (opts.homing) p.homing = true;
        if (opts.slow) p.slow = true;
        if (opts.radius) p.radius = opts.radius;
        if (opts.dtype) p.dtype = opts.dtype;
        projectiles.push(p);
        return p;
    }

    const WEAPON_ORDER = ['blaster', 'spread', 'rail', 'homing'];
    const WEAPONS = {
        blaster: {
            name: 'Blaster', icon: '🔫', color: '#00ffff', maxLevel: 10, unlockLevel: 1, buyCost: 0,
            desc: 'Laser – schnell & ausgewogen. Schwach vs. gepanzerte Gegner.',
            cooldown: (lvl, p) => Math.max(4, 13 - lvl - p.fireRateBonus),
            upgradeCost: (lvl) => 50 + lvl * 45,
            fire(p) {
                const lvl = p.weapons.blaster.level;
                const dmg = 9 + lvl * 3 + p.damageBonus;
                const my = p.y - p.height / 2;
                const o = { dtype: 'energy' };
                if (lvl < 3) {
                    spawnPlayerShot(p.x, my, 0, -13, '#00ffff', dmg, o);
                } else if (lvl < 5) {
                    spawnPlayerShot(p.x - 7, my, 0, -13, '#00ffff', dmg, o);
                    spawnPlayerShot(p.x + 7, my, 0, -13, '#00ffff', dmg, o);
                } else if (lvl < 7) {
                    spawnPlayerShot(p.x, my, 0, -14, '#00ffff', dmg, o);
                    spawnPlayerShot(p.x - 12, my, -1.5, -13, '#00ffff', dmg, o);
                    spawnPlayerShot(p.x + 12, my, 1.5, -13, '#00ffff', dmg, o);
                } else {

    const MODULES = [

    ];

    // Nearest hostile (enemies, boss, missiles) for homing shots
    function nearestHostile(x, y, maxRange = Infinity) {
        let best = null, bd = maxRange;
        enemies.forEach(e => { if (!e.markedForDeletion) { const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; best = e; } } });
        missiles.forEach(m => { if (!m.markedForDeletion) { const d = Math.hypot(m.x - x, m.y - y); if (d < bd) { bd = d; best = m; } } });
        if (typeof boss !== 'undefined' && boss && !boss.markedForDeletion) { const d = Math.hypot(boss.x - x, boss.y - y); if (d < bd) { bd = d; best = boss; } }
        return best;
    }

    // --- DAMAGE TYPE MATCHUPS ---
    // How each armor class reacts to each damage type (multiplier on damage).
    //   light   – ungepanzerte Jäger: leicht anfällig für kinetisch
    //   shielded– Energieschild-Träger: Laser sehr stark, kinetisch schwach
    //   heavy   – schwer gepanzert: Laser prallt ab, Raketen zerreißen sie
    const DAMAGE_MULT = {
        light:    { energy: 1.0,  kinetic: 1.2, rocket: 0.85 },
        shielded: { energy: 1.5,  kinetic: 0.5, rocket: 0.9  },
        heavy:    { energy: 0.45, kinetic: 1.1, rocket: 1.7  }
    };
    function damageMultiplier(dtype, armorClass) {
        const row = DAMAGE_MULT[armorClass];
        if (!row || !dtype) return 1;
        return row[dtype] != null ? row[dtype] : 1;
    }

    // --- WEAPON SWITCHING + ABILITIES (input) ---
    function selectWeaponByIndex(i) {
        if (!player || isGameOver) return;
        const id = WEAPON_ORDER[i];
        if (id && player.weapons[id].owned) {
            player.currentWeapon = id;
            player.weaponCooldown = 0;
            updateControlBar();
        }
    }
    function useAbility(id) {
        if (!player || isGameOver || isBuildPhase) return;
        const a = player.abilities[id];
        if (a && a.owned && a.cd <= 0) {
            ABILITIES[id].activate(player);
            a.cd = ABILITIES[id].cooldown;
            updateControlBar();
        }
    }

    // --- CONTROL BAR (bottom, touch + mouse) ---
    function buildControlBar() {
        weaponBar.innerHTML = '';
        abilityBar.innerHTML = '';

        WEAPON_ORDER.forEach((id, idx) => {
            const w = WEAPONS[id];
            const btn = document.createElement('div');
            btn.className = 'ctrl-btn weapon-btn';
            btn.dataset.w = id;
            btn.innerHTML = `<span class="ic">${w.icon}</span><span class="lvl"></span>`;
            const pick = (e) => { if (e) e.preventDefault(); selectWeaponByIndex(idx); };
            btn.addEventListener('click', pick);
            btn.addEventListener('touchstart', pick, { passive: false });
            weaponBar.appendChild(btn);
        });

        ABILITY_ORDER.forEach(id => {
            const a = ABILITIES[id];
            const btn = document.createElement('div');
            btn.className = 'ctrl-btn ability-btn';
            btn.dataset.a = id;
            btn.innerHTML = `<span class="ic">${a.icon}</span><div class="cd"></div><div class="cd-txt"></div>`;
            const use = (e) => { if (e) e.preventDefault(); useAbility(id); };
            btn.addEventListener('click', use);
            btn.addEventListener('touchstart', use, { passive: false });
            abilityBar.appendChild(btn);
        });
        updateControlBar();
    }

    function updateControlBar() {
        if (!player) return;
        weaponBar.querySelectorAll('.weapon-btn').forEach(btn => {
            const id = btn.dataset.w;
            const w = player.weapons[id];
            btn.classList.toggle('locked', !w.owned);
            btn.classList.toggle('selected', player.currentWeapon === id);
            btn.querySelector('.lvl').innerText = w.owned ? ('Lv' + w.level) : '🔒';
        });
        abilityBar.querySelectorAll('.ability-btn').forEach(btn => {
            const id = btn.dataset.a;
            const a = player.abilities[id];
            btn.classList.toggle('locked', !a.owned);
            const cdEl = btn.querySelector('.cd');
            const txtEl = btn.querySelector('.cd-txt');
            if (a.owned && a.cd > 0) {
                const frac = a.cd / ABILITIES[id].cooldown;
                cdEl.style.height = `${Math.round(frac * 100)}%`;
                txtEl.innerText = Math.ceil(a.cd / 60);
            } else {
                cdEl.style.height = '0%';
                txtEl.innerText = '';
            }
        });
    }

    // --- KLASSEN ---

    class Entity {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.hp = 100;
            this.maxHp = 100;
            this.shield = 50;
            this.maxShield = 50;
            this.markedForDeletion = false;
        }

        takeDamage(amount) {
            if (this.shield > 0) {
                this.shield -= amount;
                if (this.shield < 0) {
                    this.hp += this.shield;
                    this.shield = 0;
                }
            } else {
                this.hp -= amount;
            }

            if (this.hp <= 0) {
                this.markedForDeletion = true;
                createParticles(this.x, this.y, '#ff8800', 30);
            }
        }

        drawShield(radius) {
            if (this.shield > 0) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                const opacity = Math.max(0.2, this.shield / this.maxShield);
                ctx.strokeStyle = `rgba(51, 170, 255, ${opacity})`;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#33aaff';
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }
    }

    class Wingman extends Entity {
        constructor(offsetX, offsetY) {
            super(0, 0);
            this.offsetX = offsetX;
            this.offsetY = offsetY;
            this.width = 20;
            this.height = 30;
            this.maxHp = 50;
            this.hp = 50;
            this.maxShield = 30;
            this.shield = 30;
        }

        updatePos(playerX, playerY) {
            this.x += ((playerX + this.offsetX) - this.x) * 0.2;
            this.y = playerY + this.offsetY;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            const w = this.width;
            const h = this.height;

            // Engine glow
            const flame = 6 + Math.sin(frameCount * 0.6) * 3;
            const flameGrad = ctx.createLinearGradient(0, h / 2, 0, h / 2 + flame + 8);
            flameGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
            flameGrad.addColorStop(0.4, 'rgba(0,255,170,0.8)');
            flameGrad.addColorStop(1, 'rgba(0,255,170,0)');
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(-5, h / 2 - 3);
            ctx.lineTo(0, h / 2 + flame + 8);
            ctx.lineTo(5, h / 2 - 3);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffaa';

            // Wings
            ctx.fillStyle = '#0a4a3a';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(w * 0.6, h * 0.5);
            ctx.lineTo(0, h * 0.25);
            ctx.lineTo(-w * 0.6, h * 0.5);
            ctx.closePath();
            ctx.fill();

            // Body
            const bodyGrad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
            bodyGrad.addColorStop(0, '#00aa77');
            bodyGrad.addColorStop(0.5, '#aaffee');
            bodyGrad.addColorStop(1, '#00aa77');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -h / 2);
            ctx.lineTo(w * 0.22, h * 0.4);
            ctx.lineTo(0, h * 0.25);
            ctx.lineTo(-w * 0.22, h * 0.4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            this.drawShield(22);

            ctx.fillStyle = '#ff3333';
            ctx.fillRect(this.x - 15, this.y + 20, 30, 4);
            ctx.fillStyle = '#33ff33';
            ctx.fillRect(this.x - 15, this.y + 20, 30 * (Math.max(0, this.hp) / this.maxHp), 4);
        }
    }

    class Player extends Entity {
        constructor() {
            super(canvas.width / 2, canvas.height - 130);
            this.width = 36;
            this.height = 48;
            this.speed = 8;
            this.weaponCooldown = 0;

            this.maxHp = 100;
            this.hp = 100;
            this.maxShield = 100;
            this.shield = 100;

            // Upgradeable stats (from modules)
            this.damageBonus = 0;
            this.fireRateBonus = 0;
            this.shieldRegen = 0.05;
            this.scrapBonus = 0;
            this.xpMultiplier = 1;
            this.invuln = 0;
            this.overdrive = 0;

            // Multiple weapons — blaster owned from start
            this.weapons = {};
            WEAPON_ORDER.forEach(id => {
                this.weapons[id] = { owned: id === 'blaster', level: 1 };
            });
            this.currentWeapon = 'blaster';

            // Active abilities (bought in build phase)
            this.abilities = {};
            ABILITY_ORDER.forEach(id => { this.abilities[id] = { owned: false, cd: 0 }; });

            // Module tiers (ship customization)
            this.moduleTiers = {};
            MODULES.forEach(m => { this.moduleTiers[m.id] = 0; });

            this.wingmenSlots = [
                { offset: -55, y: 15, active: null },
                { offset: 55, y: 15, active: null },
                { offset: -95, y: 35, active: null },
                { offset: 95, y: 35, active: null }
            ];
        }

        takeDamage(amount) {
            if (this.invuln > 0) return;
            super.takeDamage(amount);
        }

        respawn() {
            this.hp = this.maxHp;
            this.shield = this.maxShield;
            this.markedForDeletion = false;
            this.invuln = 120; // ~2s at 60fps
            this.x = canvas.width / 2;
            targetX = canvas.width / 2;
            createParticles(this.x, this.y, '#00ffff', 30, 2);
            score = Math.max(0, score - 50);
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            if (this.invuln > 0) {
                ctx.globalAlpha = (Math.floor(frameCount / 4) % 2 === 0) ? 0.35 : 0.85;
            }
            const w = this.width;
            const h = this.height;

            // --- Engine thruster flames (animated) ---
            const flame = 10 + Math.sin(frameCount * 0.6) * 4;
            const flameGrad = ctx.createLinearGradient(0, h / 2, 0, h / 2 + flame + 12);
            flameGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
            flameGrad.addColorStop(0.4, 'rgba(0,255,255,0.8)');
            flameGrad.addColorStop(1, 'rgba(0,80,255,0)');
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(-7, h / 2 - 4);
            ctx.lineTo(0, h / 2 + flame + 12);
            ctx.lineTo(7, h / 2 - 4);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 18;
            ctx.shadowColor = '#00eaff';

            // --- Swept wings (dark metallic) ---
            ctx.fillStyle = '#0a3a55';
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.15);
            ctx.lineTo(w * 0.7, h * 0.5);
            ctx.lineTo(w * 0.28, h * 0.35);
            ctx.lineTo(0, h * 0.15);
            ctx.lineTo(-w * 0.28, h * 0.35);
            ctx.lineTo(-w * 0.7, h * 0.5);
            ctx.closePath();
            ctx.fill();

            // Wing edge glow
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // --- Main fuselage (sleek body) ---
            const bodyGrad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
            bodyGrad.addColorStop(0, '#0088aa');
            bodyGrad.addColorStop(0.5, '#aef7ff');
            bodyGrad.addColorStop(1, '#0088aa');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -h / 2);
            ctx.lineTo(w * 0.16, -h * 0.1);
            ctx.lineTo(w * 0.2, h * 0.45);
            ctx.lineTo(0, h * 0.35);
            ctx.lineTo(-w * 0.2, h * 0.45);
            ctx.lineTo(-w * 0.16, -h * 0.1);
            ctx.closePath();
            ctx.fill();

            // --- Cockpit canopy ---
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffffff';
            const cockGrad = ctx.createRadialGradient(0, -h * 0.05, 1, 0, -h * 0.05, 8);
            cockGrad.addColorStop(0, '#ffffff');
            cockGrad.addColorStop(1, '#0044aa');
            ctx.fillStyle = cockGrad;
            ctx.beginPath();
            ctx.ellipse(0, -h * 0.08, w * 0.09, h * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            this.drawShield(35);

            this.wingmenSlots.forEach(slot => {
                if (slot.active) slot.active.draw();
            });
        }

        update() {
            if (keys.ArrowLeft || keys.a || keys.A) targetX -= this.speed;
            if (keys.ArrowRight || keys.d || keys.D) targetX += this.speed;

            if (targetX < 20) targetX = 20;
            if (targetX > canvas.width - 20) targetX = canvas.width - 20;

            this.x += (targetX - this.x) * 0.3;

            if (this.invuln > 0) this.invuln--;
            if (this.overdrive > 0) this.overdrive--;

            // Ability cooldowns
            ABILITY_ORDER.forEach(id => { if (this.abilities[id].cd > 0) this.abilities[id].cd--; });

            // Passive shield regen
            if (this.shield < this.maxShield) {
                this.shield = Math.min(this.maxShield, this.shield + this.shieldRegen);
            }

            // Fire current weapon
            if (this.weaponCooldown > 0) {
                this.weaponCooldown--;
            } else {
                const w = WEAPONS[this.currentWeapon];
                const lvl = this.weapons[this.currentWeapon].level;
                w.fire(this);
                let cd = w.cooldown(lvl, this);
                if (this.overdrive > 0) cd = Math.max(2, Math.round(cd * 0.4));
                this.weaponCooldown = cd;
            }

            // Wingmen supporting fire (independent cadence)
            if (frameCount % (this.overdrive > 0 ? 5 : 11) === 0) this.shoot();

            hpBar.style.width = `${Math.max(0, (this.hp / this.maxHp) * 100)}%`;
            shieldBar.style.width = `${Math.max(0, (this.shield / this.maxShield) * 100)}%`;
            weaponText.innerText = WEAPONS[this.currentWeapon].name;
            if (frameCount % 4 === 0) updateControlBar();

            this.wingmenSlots.forEach(slot => {
                if (slot.active) {
                    slot.active.updatePos(this.x, this.y);
                    if (slot.active.markedForDeletion) {
                        slot.active = null; 
                    }
                }
            });

            // Player death => respawn (game only ends when mothership dies)
            if (this.hp <= 0) this.respawn();
        }

        shoot() {
            // Wingmen provide supporting fire alongside the active weapon
            this.wingmenSlots.forEach(slot => {
                if (slot.active) {
                    const wp = new Projectile(slot.active.x, slot.active.y - 15, 0, -10, '#00ffaa', 8 + this.damageBonus);
                    projectiles.push(wp);
                }
            });
        }

        addWingman() {
            let emptySlot = this.wingmenSlots.find(s => s.active === null);
            if (emptySlot) {
                emptySlot.active = new Wingman(emptySlot.offset, emptySlot.y);
                emptySlot.active.x = this.x + emptySlot.offset;
                emptySlot.active.y = this.y + emptySlot.y;
            } else {
                score += 150; 
            }
        }
    }

    class Projectile {
        constructor(x, y, vx, vy, color, damage = null) {
            this.x = x; this.y = y;
            this.vx = vx; this.vy = vy;
            this.color = color;
            this.radius = 4;
            this.piercing = false;
            this.homing = false;
            this.slow = false;
            this.dtype = 'energy'; // damage type: energy | kinetic | rocket
            this.damage = damage; // null => use fallback in collision
            this.markedForDeletion = false;
        }
        draw() {
            const angle = Math.atan2(this.vy, this.vx);

            // --- Homing rocket: distinct missile look (body, nose, fins, flame) ---
            if (this.homing) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(angle + Math.PI / 2); // point in travel direction (nose up)

                // Exhaust flame trail (flickering)
                const flick = 6 + Math.sin(frameCount * 0.8) * 3;
                const fg = ctx.createLinearGradient(0, 8, 0, 8 + flick + 6);
                fg.addColorStop(0, 'rgba(255,255,255,0.95)');
                fg.addColorStop(0.4, 'rgba(255,150,60,0.85)');
                fg.addColorStop(1, 'rgba(255,60,60,0)');
                ctx.fillStyle = fg;
                ctx.beginPath();
                ctx.moveTo(-4, 8);
                ctx.lineTo(0, 8 + flick + 6);
                ctx.lineTo(4, 8);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;

                // Tail fins
                ctx.fillStyle = '#ff2288';
                ctx.beginPath();
                ctx.moveTo(-3, 6);
                ctx.lineTo(-7, 11);
                ctx.lineTo(-3, 9);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(3, 6);
                ctx.lineTo(7, 11);
                ctx.lineTo(3, 9);
                ctx.closePath();
                ctx.fill();

                // Rocket body (rounded capsule)
                const body = ctx.createLinearGradient(-4, 0, 4, 0);
                body.addColorStop(0, '#aa0055');
                body.addColorStop(0.5, '#ff99cc');
                body.addColorStop(1, '#aa0055');
                ctx.fillStyle = body;
                ctx.beginPath();
                ctx.moveTo(0, -11);       // nose tip
                ctx.lineTo(4, -4);
                ctx.lineTo(4, 7);
                ctx.lineTo(-4, 7);
                ctx.lineTo(-4, -4);
                ctx.closePath();
                ctx.fill();

                // Bright nose cone
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(0, -11);
                ctx.lineTo(3, -4);
                ctx.lineTo(-3, -4);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
                ctx.shadowBlur = 0;
                return;
            }

            const speed = Math.hypot(this.vx, this.vy);
            const len = Math.max(14, speed * 1.6);

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(angle + Math.PI / 2); // align bolt with travel direction

            // Outer glow halo
            ctx.shadowBlur = 16;
            ctx.shadowColor = this.color;

            // Elongated energy bolt (gradient core -> color)
            const grad = ctx.createLinearGradient(0, -len / 2, 0, len / 2);
            grad.addColorStop(0, 'rgba(255,255,255,0)');
            grad.addColorStop(0.35, '#ffffff');
            grad.addColorStop(0.5, this.color);
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, 0, this.radius, len / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Bright white hot core
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, 0, this.radius * 0.45, len * 0.32, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            ctx.shadowBlur = 0;
        }
        update() {
            if (this.homing) {
                const target = nearestHostile(this.x, this.y, 320);
                if (target) {
                    const desired = Math.atan2(target.y - this.y, target.x - this.x);
                    const spd = Math.hypot(this.vx, this.vy) || 9;
                    let cur = Math.atan2(this.vy, this.vx);
                    let diff = desired - cur;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    cur += Math.max(-0.14, Math.min(0.14, diff));
                    this.vx = Math.cos(cur) * spd;
                    this.vy = Math.sin(cur) * spd;
                }
                if (frameCount % 2 === 0) particles.push(new Particle(this.x, this.y + 6, '#ffaa66', 0.5));
            }
            this.x += this.vx;
            this.y += this.vy;
            if (this.y < -50 || this.x < -50 || this.x > canvas.width + 50) this.markedForDeletion = true;
        }
    }

    class Enemy extends Entity {
        constructor(type = 'grunt') {
            super(Math.random() * (canvas.width - 40) + 20, -50);
            this.type = type;
            this.shield = 0;
            this.fireTimer = 40 + Math.random() * 60;
            this.hitFlash = 0;
            this.slowTimer = 0;
            const waveScale = 1 + (wave - 1) * 0.10 + Math.max(0, wave - 8) * 0.06;
            const armorMod = (waveModifier === 'armor') ? 1.7 : 1;

            if (type === 'grunt') {
                this.width = 35; this.height = 35;
                this.velocity = Math.min(7, 2 + Math.random() * 1.5 + wave * 0.13);
                this.maxHp = Math.round(25 * waveScale * armorMod);
                this.ramDamage = 12;
                this.xpValue = 1; this.scoreValue = 20; this.scrapValue = 9;
                this.accent = '#ff1133'; this.eye = '255, 30, 30';
                this.armorClass = 'light';
            } else if (type === 'kamikaze') {
                this.width = 28; this.height = 34;
                this.velocity = Math.min(9.5, 4 + Math.random() * 1.5 + wave * 0.17);
                this.maxHp = Math.round(15 * waveScale * armorMod);
                this.ramDamage = 22;
                this.xpValue = 2; this.scoreValue = 30; this.scrapValue = 11;
                this.accent = '#ff8800'; this.eye = '255, 160, 30';
                this.armorClass = 'light';
            } else if (type === 'shooter') {
                this.width = 38; this.height = 34;
                this.velocity = 1.6 + Math.random() * 0.6;
                this.maxHp = Math.round(30 * waveScale * armorMod);
                this.ramDamage = 12;
                this.xpValue = 3; this.scoreValue = 40; this.scrapValue = 16;
                this.accent = '#cc44ff'; this.eye = '210, 90, 255';
                this.holdY = 90 + Math.random() * 120;
                this.strafeDir = Math.random() > 0.5 ? 1 : -1;
                this.armorClass = 'shielded';
            } else if (type === 'bomber') {
                this.width = 52; this.height = 48;
                this.velocity = 1.0 + Math.random() * 0.4;
                this.maxHp = Math.round(70 * waveScale * armorMod);
                this.ramDamage = 25;
                this.xpValue = 4; this.scoreValue = 60; this.scrapValue = 24;
                this.accent = '#33ff88'; this.eye = '80, 255, 150';
                this.holdY = 70 + Math.random() * 90;
                this.armorClass = 'heavy';
            }
            this.hp = this.maxHp;

            // Elite variants appear increasingly often at higher waves:
            // regenerating-free energy shield, tougher hull, big scrap reward.
            this.elite = wave >= 6 && Math.random() < Math.min(0.45, 0.06 * (wave - 5));
            if (this.elite) {
                this.maxHp = Math.round(this.maxHp * 1.4);
                this.hp = this.maxHp;
                this.maxShield = Math.round(25 + wave * 5);
                this.shield = this.maxShield;
                this.scrapValue = Math.round(this.scrapValue * 1.8);
                this.xpValue += 2;
                this.ramDamage = Math.round(this.ramDamage * 1.25);
            }
        }

        takeDamage(amount) {
            super.takeDamage(amount);
            this.hitFlash = 4;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            const w = this.width;
            const h = this.height;

            ctx.rotate(Math.sin(frameCount * 0.1 + this.x) * 0.06);
            ctx.shadowBlur = 14;
            ctx.shadowColor = this.accent;

            // Outer jagged wings
            ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#0a0a0f';
            ctx.beginPath();
            ctx.moveTo(0, h * 0.55);
            ctx.lineTo(w * 0.5, -h * 0.1);
            ctx.lineTo(w * 0.32, -h * 0.5);
            ctx.lineTo(w * 0.14, -h * 0.2);
            ctx.lineTo(0, -h * 0.45);
            ctx.lineTo(-w * 0.14, -h * 0.2);
            ctx.lineTo(-w * 0.32, -h * 0.5);
            ctx.lineTo(-w * 0.5, -h * 0.1);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = this.accent;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Inner armored hull
            const hullGrad = ctx.createLinearGradient(0, -h * 0.4, 0, h * 0.5);
            hullGrad.addColorStop(0, this.hitFlash > 0 ? '#ffffff' : '#2a2a33');
            hullGrad.addColorStop(1, '#050507');
            ctx.fillStyle = hullGrad;
            ctx.beginPath();
            ctx.moveTo(0, h * 0.5);
            ctx.lineTo(w * 0.24, -h * 0.15);
            ctx.lineTo(0, -h * 0.3);
            ctx.lineTo(-w * 0.24, -h * 0.15);
            ctx.closePath();
            ctx.fill();

            // Glowing evil eyes
            const eyePulse = 0.6 + Math.sin(frameCount * 0.2) * 0.4;
            ctx.shadowBlur = 12;
            ctx.shadowColor = `rgb(${this.eye})`;
            ctx.fillStyle = `rgba(${this.eye}, ${eyePulse})`;
            ctx.beginPath();
            ctx.moveTo(-w * 0.16, -h * 0.05);
            ctx.lineTo(-w * 0.04, h * 0.02);
            ctx.lineTo(-w * 0.14, h * 0.08);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(w * 0.16, -h * 0.05);
            ctx.lineTo(w * 0.04, h * 0.02);
            ctx.lineTo(w * 0.14, h * 0.08);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Elite marker: golden aura ring
            if (this.elite) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255,210,80,0.85)';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffcc33';
                ctx.beginPath();
                ctx.arc(this.x, this.y, (w + h) / 3.4, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            // Energy shield bubble (elite enemies)
            if (this.shield > 0) this.drawShield((w + h) / 3);

            // Armor-class badge so the player knows which weapon to use
            if (this.armorClass === 'heavy' || this.armorClass === 'shielded') {
                ctx.save();
                const by = this.y + h / 2 + 9;
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 6;
                if (this.armorClass === 'heavy') {
                    ctx.shadowColor = '#ff9933';
                    ctx.fillText('🛡️', this.x, by); // panzer -> Raketen nutzen
                } else {
                    ctx.shadowColor = '#66ccff';
                    ctx.fillText('💠', this.x, by); // schild -> Laser nutzen
                }
                ctx.restore();
            }

            // HP pip for tougher enemies
            if (this.maxHp > 40 && this.hp < this.maxHp) {
                ctx.fillStyle = '#300';
                ctx.fillRect(this.x - w/2, this.y - h/2 - 8, w, 3);
                ctx.fillStyle = this.accent;
                ctx.fillRect(this.x - w/2, this.y - h/2 - 8, w * (this.hp / this.maxHp), 3);
            }
        }

        update() {
            if (this.hitFlash > 0) this.hitFlash--;
            if (this.slowTimer > 0) this.slowTimer--;
            const sf = this.slowTimer > 0 ? 0.4 : 1; // slow factor
            const v = this.velocity * sf;
            const targetX2 = mothership ? mothership.x : canvas.width / 2;

            if (this.type === 'grunt') {
                this.y += v;
                this.x += Math.sign(targetX2 - this.x) * 0.4 * sf;
            } else if (this.type === 'kamikaze') {
                this.y += v;
                this.x += (targetX2 - this.x) * 0.04 * sf;
            } else if (this.type === 'shooter') {
                if (this.y < this.holdY) {
                    this.y += v;
                } else {
                    this.x += this.strafeDir * 1.6 * sf;
                    if (this.x < 40 || this.x > canvas.width - 40) this.strafeDir *= -1;
                }
                this.fireTimer--;
                if (this.fireTimer <= 0 && this.y >= this.holdY - 10) {
                    this.fireAtTarget();
                    this.fireTimer = Math.max(35, 90 - wave * 2) + Math.random() * 40;
                }
            } else if (this.type === 'bomber') {
                if (this.y < this.holdY) {
                    this.y += v;
                } else {
                    this.y += 0.3 * sf;
                }
                this.fireTimer--;
                if (this.fireTimer <= 0 && this.y >= this.holdY - 10) {
                    this.dropBomb();
                    this.fireTimer = Math.max(60, 130 - wave * 2) + Math.random() * 50;
                }
            }

            if (this.y > canvas.height + 50) this.markedForDeletion = true;
        }

        fireAtTarget() {
            const tx = mothership ? mothership.x : player.x;
            const ty = mothership ? mothership.y : player.y;
            const ang = Math.atan2(ty - this.y, tx - this.x);
            const spd = 5;
            enemyProjectiles.push(new EnemyProjectile(
                this.x, this.y + this.height / 2,
                Math.cos(ang) * spd, Math.sin(ang) * spd,
                '#cc44ff', 8, 5
            ));
        }

        dropBomb() {
            enemyProjectiles.push(new EnemyProjectile(
                this.x, this.y + this.height / 2,
                0, 3, '#33ff88', 16, 9
            ));
        }
    }

    class EnemyProjectile {
        constructor(x, y, vx, vy, color, damage, radius) {
            this.x = x; this.y = y;
            this.vx = vx; this.vy = vy;
            this.color = color;
            this.damage = damage;
            this.radius = radius;
            this.markedForDeletion = false;
        }
        draw() {
            const angle = Math.atan2(this.vy, this.vx);
            const len = Math.max(12, Math.hypot(this.vx, this.vy) * 2);
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(angle + Math.PI / 2);
            ctx.shadowBlur = 14;
            ctx.shadowColor = this.color;
            const grad = ctx.createLinearGradient(0, -len / 2, 0, len / 2);
            grad.addColorStop(0, 'rgba(255,255,255,0)');
            grad.addColorStop(0.4, this.color);
            grad.addColorStop(0.5, '#ffffff');
            grad.addColorStop(0.6, this.color);
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, 0, this.radius, len / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            ctx.shadowBlur = 0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.y > canvas.height + 50 || this.y < -50 || this.x < -50 || this.x > canvas.width + 50) {
                this.markedForDeletion = true;
            }
        }
    }

    class Perk {
        constructor() {
            this.radius = 18;
            this.x = Math.random() * (canvas.width - this.radius*2) + this.radius;
            this.y = -50;
            this.velocity = 2.5;
            this.markedForDeletion = false;
            
            const types = [
                { id: 'wingman', color: '#33ff33', symbol: '+' },
                { id: 'weapon', color: '#ff3333', symbol: 'W' },
                { id: 'shield', color: '#33aaff', symbol: 'S' },
                { id: 'health', color: '#ff33ff', symbol: 'H' }
            ];
            this.typeInfo = types[Math.floor(Math.random() * types.length)];
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            let scale = 1 + Math.sin(frameCount * 0.1) * 0.1;
            ctx.scale(scale, scale);

            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = this.typeInfo.color;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.typeInfo.color;
            ctx.stroke();
            
            ctx.fillStyle = this.typeInfo.color;
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.typeInfo.symbol, 0, 1);
            
            ctx.restore();
        }
        update() {
            this.y += this.velocity;
            if (this.y > canvas.height + 50) this.markedForDeletion = true;
        }
    }

    class Particle {
        constructor(x, y, color, speedMultiplier = 1) {
            this.x = x; this.y = y;
            this.velocity = { 
                x: (Math.random() - 0.5) * 10 * speedMultiplier, 
                y: (Math.random() - 0.5) * 10 * speedMultiplier 
            };
            this.color = color;
            this.life = 1.0;
            this.markedForDeletion = false;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.life;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
        update() {
            this.x += this.velocity.x;
            this.y += this.velocity.y;
            this.life -= 0.03;
            if (this.life <= 0) this.markedForDeletion = true;
        }
    }

    // Turret tuning per level: [damage, cooldown(frames), projectileColor]
    const TURRET_TYPES = {
        gun: {
            name: 'Geschütz', icon: '🔫', color: '#66ffcc', desc: 'Schneller Allrounder',
            levels: [
                { dmg: 8,  cd: 40, range: 900 },
                { dmg: 14, cd: 32, range: 900 },
                { dmg: 22, cd: 24, range: 900 },
                { dmg: 32, cd: 16, range: 900 }
            ]
        },
        flak: {
            name: 'Flak', icon: '🎯', color: '#ffcc33', desc: 'Jagt Raketen & Bomber',
            levels: [
                { dmg: 14, cd: 58, range: 1050 },
                { dmg: 22, cd: 48, range: 1050 },
                { dmg: 34, cd: 38, range: 1050 },
                { dmg: 50, cd: 28, range: 1050 }
            ]
        },
        rail: {
            name: 'Railgun', icon: '⚡', color: '#66ccff', desc: 'Durchschlägt alles',
            levels: [
                { dmg: 26, cd: 78, range: 1300, pierce: true },
                { dmg: 40, cd: 66, range: 1300, pierce: true },
                { dmg: 58, cd: 54, range: 1300, pierce: true },
                { dmg: 82, cd: 42, range: 1300, pierce: true }
            ]
        },
        slow: {
            name: 'Frostturm', icon: '❄️', color: '#aaddff', desc: 'Verlangsamt Gegner',
            levels: [
                { dmg: 4,  cd: 64, range: 900, slow: true },
                { dmg: 7,  cd: 56, range: 950, slow: true },
                { dmg: 11, cd: 48, range: 1000, slow: true },
                { dmg: 16, cd: 40, range: 1050, slow: true }
            ]
        }
    };
    const TURRET_MAX_LEVEL = 4;

    class Mothership {
        constructor() {
            this.x = canvas.width / 2;
            this.width = canvas.width * 0.92;
            this.height = 74;
            this.y = canvas.height - 28;
            this.top = this.y - this.height / 2;
            this.maxHp = 600;
            this.hp = 600;
            this.armor = 0;        // flat damage reduction from upgrades
            this.regen = 0;        // hp per frame from upgrades
            this.hitFlash = 0;

            // Shield system (level 0 = passive, no shield until installed)
            this.maxShield = 0;
            this.shield = 0;
            this.shieldRegen = 0;      // per frame once installed
            this.shieldDelay = 0;      // frames to wait after a hit before regen
            this.shieldFlash = 0;

            // Fixed turret mounting points (offset factor of width, from left to right)
            this.turretSlots = [-0.34, -0.12, 0.12, 0.34].map(f => ({
                ox: f * this.width,
                turret: null
            }));
        }

        get freeTurretSlot() {
            return this.turretSlots.find(s => s.turret === null) || null;
        }
        get upgradableTurret() {
            const ts = this.turretSlots
                .filter(s => s.turret && s.turret.level < TURRET_MAX_LEVEL)
                .map(s => s.turret);
            return ts.length ? ts.sort((a, b) => a.level - b.level)[0] : null;
        }
        get turretCount() {
            return this.turretSlots.filter(s => s.turret).length;
        }

        addTurret(type = 'gun') {
            const slot = this.freeTurretSlot;
            if (slot) {
                slot.turret = { type, level: 1, cooldown: 0, aim: -Math.PI / 2 };
                createParticles(this.x + slot.ox, this.top, TURRET_TYPES[type].color, 14, 1.5);
                return true;
            }
            return false;
        }

        upgradeTurret() {
            const t = this.upgradableTurret;
            if (t) {
                t.level = Math.min(TURRET_MAX_LEVEL, t.level + 1);
                return true;
            }
            return false;
        }

        installShield() {
            this.maxShield = 220;
            this.shield = 220;
            this.shieldRegen = 0.15;
            mothershipShieldWrap.style.display = 'block';
        }

        takeDamage(amount) {
            let dmg = Math.max(1, amount - this.armor);
            this.shieldDelay = 90; // pause shield regen after being hit

            if (this.shield > 0) {
                this.shieldFlash = 8;
                this.shield -= dmg;
                if (this.shield < 0) {
                    dmg = -this.shield;   // overflow passes to hull
                    this.shield = 0;
                } else {
                    dmg = 0;
                }
            }

            if (dmg > 0) {
                this.hp -= dmg;
                this.hitFlash = 6;
                createParticles(this.x + (Math.random() - 0.5) * this.width * 0.6, this.top, '#ff8800', 10, 1.5);
            }
            addShake(6, 12);

            if (this.hp <= 0) {
                this.hp = 0;
                isGameOver = true;
                createParticles(this.x, this.y, '#ff4400', 80, 3);
                addShake(30, 40);
            }
        }

        update() {
            if (this.hitFlash > 0) this.hitFlash--;
            if (this.shieldFlash > 0) this.shieldFlash--;
            if (this.regen > 0 && this.hp < this.maxHp) {
                this.hp = Math.min(this.maxHp, this.hp + this.regen);
            }

            // Shield regen after a short delay
            if (this.shieldDelay > 0) this.shieldDelay--;
            if (this.maxShield > 0 && this.shieldDelay === 0 && this.shield < this.maxShield) {
                this.shield = Math.min(this.maxShield, this.shield + this.shieldRegen);
            }

            // Turret targeting + firing
            const turretY = this.top - 4;
            this.turretSlots.forEach(slot => {
                const t = slot.turret;
                if (!t) return;
                if (t.cooldown > 0) t.cooldown--;
                const tx = this.x + slot.ox;
                const def = TURRET_TYPES[t.type];
                const cfg = def.levels[t.level - 1];
                const target = findTurretTarget(tx, turretY, cfg.range, t.type);
                if (target) {
                    t.aim = Math.atan2(target.y - turretY, target.x - tx);
                    if (t.cooldown <= 0) {
                        const spd = t.type === 'rail' ? 16 : 12;
                        const p = new Projectile(
                            tx, turretY,
                            Math.cos(t.aim) * spd, Math.sin(t.aim) * spd,
                            def.color, cfg.dmg
                        );
                        if (cfg.pierce) p.piercing = true;
                        if (cfg.slow) p.slow = true;
                        projectiles.push(p);
                        t.cooldown = cfg.cd;
                        createParticles(tx, turretY, def.color, 2, 0.6);
                    }
                } else {
                    t.aim += (-Math.PI / 2 - t.aim) * 0.1; // ease back to upward idle
                }
            });

            mothershipBar.style.width = `${Math.max(0, (this.hp / this.maxHp) * 100)}%`;
            if (this.maxShield > 0) {
                mothershipShieldBar.style.width = `${Math.max(0, (this.shield / this.maxShield) * 100)}%`;
            }
        }

        draw() {
            const w = this.width;
            const h = this.height;
            ctx.save();
            ctx.translate(this.x, this.y);

            // Engine glow along the bottom
            const eng = ctx.createLinearGradient(0, h / 2, 0, h / 2 + 26);
            eng.addColorStop(0, 'rgba(0,200,255,0.6)');
            eng.addColorStop(1, 'rgba(0,200,255,0)');
            ctx.fillStyle = eng;
            ctx.fillRect(-w / 2, h / 2 - 4, w, 30);

            ctx.shadowBlur = 18;
            ctx.shadowColor = this.hitFlash > 0 ? '#ffffff' : '#00aaff';

            // Main hull
            const hull = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
            hull.addColorStop(0, this.hitFlash > 0 ? '#ffffff' : '#4a5568');
            hull.addColorStop(0.5, '#2a3240');
            hull.addColorStop(1, '#141a24');
            ctx.fillStyle = hull;
            ctx.beginPath();
            ctx.moveTo(-w / 2, h * 0.1);
            ctx.lineTo(-w * 0.42, -h * 0.35);
            ctx.lineTo(w * 0.42, -h * 0.35);
            ctx.lineTo(w / 2, h * 0.1);
            ctx.lineTo(w * 0.42, h / 2);
            ctx.lineTo(-w * 0.42, h / 2);
            ctx.closePath();
            ctx.fill();

            // Armored deck line
            ctx.strokeStyle = '#00ccff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Command towers
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#3a4658';
            for (let tx of [-w * 0.28, 0, w * 0.28]) {
                ctx.beginPath();
                ctx.moveTo(tx - 18, -h * 0.35);
                ctx.lineTo(tx - 10, -h * 0.7);
                ctx.lineTo(tx + 10, -h * 0.7);
                ctx.lineTo(tx + 18, -h * 0.35);
                ctx.closePath();
                ctx.fill();
            }

            // Window lights
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 220, 140, 0.9)';
            for (let i = -w * 0.36; i < w * 0.36; i += 14) {
                ctx.fillRect(i, -h * 0.1, 4, 3);
            }

            ctx.restore();

            // Defense turrets on the deck
            this.drawTurrets();

            // Shield dome
            if (this.maxShield > 0 && this.shield > 0) {
                this.drawShieldDome();
            }

            // Damage-based sparks when low
            if (this.hp < this.maxHp * 0.35 && frameCount % 6 === 0) {
                createParticles(this.x + (Math.random() - 0.5) * w * 0.7, this.top + 6, '#ffaa00', 2, 1);
            }
        }

        drawTurrets() {
            const turretY = this.top - 4;
            this.turretSlots.forEach(slot => {
                const t = slot.turret;
                if (!t) return;
                const tx = this.x + slot.ox;
                const col = TURRET_TYPES[t.type].color;
                ctx.save();
                ctx.translate(tx, turretY);

                // Base
                ctx.shadowBlur = 8;
                ctx.shadowColor = col;
                ctx.fillStyle = '#243b3a';
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = col;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Barrel(s) aimed at target
                ctx.rotate(t.aim);
                ctx.fillStyle = col;
                const barrels = t.type === 'rail' ? 1 : Math.min(t.level, 3);
                const barLen = (t.type === 'rail' ? 18 : 12) + t.level * 1.5;
                for (let b = 0; b < barrels; b++) {
                    const off = (b - (barrels - 1) / 2) * 3;
                    ctx.fillRect(0, off - 1, barLen, t.type === 'rail' ? 3 : 2);
                }

                // Level pips
                ctx.rotate(-t.aim);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffee66';
                for (let l = 0; l < t.level; l++) {
                    ctx.fillRect(-6 + l * 4, 9, 3, 3);
                }
                ctx.restore();
            });
        }

        drawShieldDome() {
            const w = this.width;
            const frac = this.shield / this.maxShield;
            const alpha = (this.shieldFlash > 0 ? 0.6 : 0.22) + frac * 0.15;
            ctx.save();
            ctx.translate(this.x, this.top + 6);
            ctx.beginPath();
            ctx.ellipse(0, 0, w * 0.52, this.height * 1.5, 0, Math.PI, Math.PI * 2);
            const g = ctx.createLinearGradient(0, -this.height * 1.5, 0, 0);
            g.addColorStop(0, `rgba(100, 220, 255, ${alpha})`);
            g.addColorStop(1, `rgba(0, 120, 255, ${alpha * 0.3})`);
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = `rgba(120, 230, 255, ${Math.min(0.9, alpha + 0.3)})`;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#33ccff';
            ctx.stroke();
            ctx.restore();
        }
    }

    // Turret targeting; flak strongly favors missiles, others favor nearest threat
    function findTurretTarget(tx, ty, range, type = 'gun') {
        let best = null, bestD = range;
        // Missiles are always a candidate; flak/gun always prioritize them
        let missileBest = null, missileD = range;
        missiles.forEach(m => {
            if (m.markedForDeletion) return;
            const d = Math.hypot(m.x - tx, m.y - ty);
            if (d < missileD) { missileD = d; missileBest = m; }
        });
        if (missileBest && (type === 'flak' || type === 'gun')) return missileBest;

        if (boss && !boss.markedForDeletion) {
            const d = Math.hypot(boss.x - tx, boss.y - ty);
            if (d < bestD) { bestD = d; best = boss; }
        }
        enemies.forEach(e => {
            if (e.markedForDeletion) return;
            const d = Math.hypot(e.x - tx, e.y - ty);
            if (d < bestD) { bestD = d; best = e; }
        });
        // Fall back to missiles if nothing else in range
        return best || missileBest;
    }

    class Boss {
        constructor() {
            this.x = canvas.width / 2;
            this.y = -90;
            this.targetY = 130;
            this.width = 130;
            this.height = 96;
            this.maxHp = 500 + wave * 110;
            this.hp = this.maxHp;
            this.moveDir = 1;
            this.fireTimer = 140;
            this.volleyTimer = 240;
            this.missileTimer = 520;
            this.entering = true;
            this.hitFlash = 0;
            this.slowTimer = 0;
            this.markedForDeletion = false;
            this.xpValue = 20;
            this.scoreValue = 500;
            this.scrapValue = 120;
        }

        takeDamage(amount) {
            this.hp -= amount;
            this.hitFlash = 4;
            if (this.hp <= 0) {
                this.hp = 0;
                this.markedForDeletion = true;
                createParticles(this.x, this.y, '#ff8800', 120, 3);
                addShake(24, 45);
            }
        }

        update() {
            if (this.hitFlash > 0) this.hitFlash--;
            if (this.slowTimer > 0) this.slowTimer--;
            const sf = this.slowTimer > 0 ? 0.5 : 1;

            if (this.entering) {
                this.y += 2;
                if (this.y >= this.targetY) this.entering = false;
                return;
            }

            this.x += this.moveDir * 1.4 * sf;
            if (this.x < this.width / 2 || this.x > canvas.width - this.width / 2) this.moveDir *= -1;

            // Fan spread downward
            this.fireTimer--;
            if (this.fireTimer <= 0) {
                const spread = 5;
                for (let i = 0; i < spread; i++) {
                    const ang = Math.PI / 2 + (i - (spread - 1) / 2) * 0.28;
                    enemyProjectiles.push(new EnemyProjectile(
                        this.x, this.y + this.height / 2,
                        Math.cos(ang) * 4.5, Math.sin(ang) * 4.5,
                        '#ff3366', 6, 6
                    ));
                }
                this.fireTimer = 105;
            }

            // Aimed volley at mothership
            this.volleyTimer--;
            if (this.volleyTimer <= 0) {
                const tx = mothership ? mothership.x : canvas.width / 2;
                const ty = mothership ? mothership.y : canvas.height;
                const ang = Math.atan2(ty - this.y, tx - this.x);
                for (let s = -1; s <= 1; s++) {
                    enemyProjectiles.push(new EnemyProjectile(
                        this.x + s * 30, this.y + this.height / 2,
                        Math.cos(ang) * 5, Math.sin(ang) * 5,
                        '#ff8800', 9, 8
                    ));
                }
                this.volleyTimer = 300;
            }

            // Heavy homing missile (destructible, high damage)
            this.missileTimer--;
            if (this.missileTimer <= 0) {
                missiles.push(new Missile(this.x, this.y + this.height / 2));
                addShake(5, 8);
                this.missileTimer = 480 + Math.random() * 180;
            }
        }

        draw() {
            const w = this.width;
            const h = this.height;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#ff0033';

            // Massive jagged hull
            ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#0a0a10';
            ctx.beginPath();
            ctx.moveTo(0, h * 0.6);
            ctx.lineTo(w * 0.5, h * 0.1);
            ctx.lineTo(w * 0.4, -h * 0.45);
            ctx.lineTo(w * 0.18, -h * 0.15);
            ctx.lineTo(0, -h * 0.5);
            ctx.lineTo(-w * 0.18, -h * 0.15);
            ctx.lineTo(-w * 0.4, -h * 0.45);
            ctx.lineTo(-w * 0.5, h * 0.1);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#ff1133';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Core reactor (color shifts with HP)
            const hpFrac = this.hp / this.maxHp;
            const coreColor = hpFrac > 0.5 ? '255, 60, 60' : hpFrac > 0.25 ? '255, 140, 0' : '255, 230, 60';
            const pulse = 0.5 + Math.sin(frameCount * 0.25) * 0.5;
            ctx.shadowBlur = 25;
            ctx.shadowColor = `rgb(${coreColor})`;
            const core = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
            core.addColorStop(0, `rgba(255,255,255,${0.6 + pulse * 0.4})`);
            core.addColorStop(0.5, `rgba(${coreColor}, ${0.7 + pulse * 0.3})`);
            core.addColorStop(1, `rgba(${coreColor}, 0)`);
            ctx.fillStyle = core;
            ctx.beginPath();
            ctx.arc(0, -h * 0.05, 26, 0, Math.PI * 2);
            ctx.fill();

            // Evil eye cluster
            ctx.fillStyle = `rgba(${coreColor}, ${0.7 + pulse * 0.3})`;
            for (let ex of [-w * 0.24, -w * 0.1, w * 0.1, w * 0.24]) {
                ctx.beginPath();
                ctx.arc(ex, h * 0.02, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // Boss HP bar (on-canvas, top)
            const bw = canvas.width * 0.7;
            const bx = (canvas.width - bw) / 2;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(bx - 2, 34, bw + 4, 12);
            ctx.fillStyle = '#300';
            ctx.fillRect(bx, 36, bw, 8);
            ctx.fillStyle = '#ff2244';
            ctx.fillRect(bx, 36, bw * (this.hp / this.maxHp), 8);
            ctx.strokeStyle = '#ff6688';
            ctx.lineWidth = 1;
            ctx.strokeRect(bx, 36, bw, 8);
        }
    }

    class Missile {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.vx = 0; this.vy = 2.2;
            this.speed = 3.2;
            this.turn = 0.045;      // homing agility
            this.maxHp = 30;
            this.hp = 30;
            this.damage = 40;       // far more than a laser bolt
            this.radius = 12;
            this.hitFlash = 0;
            this.markedForDeletion = false;
            this.scoreValue = 25;
        }

        takeDamage(amount) {
            this.hp -= amount;
            this.hitFlash = 3;
            createParticles(this.x, this.y, '#ffcc66', 3, 0.8);
            if (this.hp <= 0) {
                this.explode();
            }
        }

        explode() {
            this.markedForDeletion = true;
            createParticles(this.x, this.y, '#ff8800', 24, 2);
            addShake(4, 8);
        }

        update() {
            if (this.hitFlash > 0) this.hitFlash--;

            // Home toward the mothership
            const tx = mothership ? mothership.x : canvas.width / 2;
