<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibe Squadron - Touch & Upgrades</title>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        #gameContainer { position: relative; width: 100%; max-width: 500px; height: 100vh; max-height: 850px; }
        canvas { display: block; width: 100%; height: 100%; background: linear-gradient(to bottom, #00001a, #000033); touch-action: none; cursor: crosshair; }
        #ui { position: absolute; top: 10px; left: 15px; right: 15px; font-size: 16px; font-weight: bold; pointer-events: none; display: flex; justify-content: space-between; }
        .stats { display: flex; flex-direction: column; gap: 4px; }
        .bar-container { width: 100px; height: 10px; background: #333; border: 1px solid #fff; border-radius: 5px; overflow: hidden; }
        #hpBar { height: 100%; background: #ff3333; width: 100%; transition: width 0.2s; }
        #shieldBar { height: 100%; background: #33aaff; width: 100%; transition: width 0.2s; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0, 0, 0, 0.85); padding: 30px; border: 2px solid cyan; border-radius: 10px; display: none; width: 80%; }
        button { margin-top: 15px; padding: 12px 25px; background-color: transparent; color: cyan; border: 2px solid cyan; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        button:hover { background-color: cyan; color: black; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="500" height="850"></canvas>
        <div id="ui">
            <div class="stats">
                <div style="color: #ff3333;">HP</div>
                <div class="bar-container"><div id="hpBar"></div></div>
                <div style="color: #33aaff; margin-top: 5px;">Schild</div>
                <div class="bar-container"><div id="shieldBar"></div></div>
            </div>
            <div style="text-align: right;">
                <div>Score: <span id="scoreText">0</span></div>
                <div style="color: #ffaa33; font-size: 14px; margin-top: 5px;">Waffen Lvl: <span id="weaponText">1</span></div>
            </div>
        </div>
        <div id="gameOver">
            <h2>MISSION FAILED</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">Neustart</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const weaponText = document.getElementById('weaponText');
    const hpBar = document.getElementById('hpBar');
    const shieldBar = document.getElementById('shieldBar');
    const gameOverScreen = document.getElementById('gameOver');
    const finalScoreText = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');

    let isGameOver = false, score = 0, frameCount = 0, particles = [], projectiles = [], enemies = [], perks = [];
    let targetX = canvas.width / 2;

    function updatePosition(e) {
        if (isGameOver) return;
        if (e.type === 'touchmove' || e.type === 'touchstart') e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
        targetX = (clientX - rect.left) * (canvas.width / rect.width);
    }

    canvas.addEventListener('touchstart', updatePosition, { passive: false });
    canvas.addEventListener('touchmove', updatePosition, { passive: false });
    canvas.addEventListener('mousemove', updatePosition);

    const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false, A: false, D: false };
    window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    restartBtn.addEventListener('click', () => init());

    class Entity {
        constructor(x, y) { this.x = x; this.y = y; this.hp = 100; this.maxHp = 100; this.shield = 50; this.maxShield = 50; this.markedForDeletion = false; }
        takeDamage(amount) {
            if (this.shield > 0) { this.shield -= amount; if (this.shield < 0) { this.hp += this.shield; this.shield = 0; } }
            else this.hp -= amount;
            if (this.hp <= 0) { this.markedForDeletion = true; createParticles(this.x, this.y, '#ff8800', 30); }
        }
        drawShield(radius) {
            if (this.shield > 0) {
                ctx.beginPath(); ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(51, 170, 255, ${Math.max(0.2, this.shield / this.maxShield)})`;
                ctx.lineWidth = 3; ctx.stroke();
            }
        }
    }

    class Player extends Entity {
        constructor() { super(canvas.width / 2, canvas.height - 100); this.width = 36; this.height = 48; this.speed = 8; this.weaponLevel = 1; this.shootCooldown = 0; this.wingmenSlots = [{ offset: -55, y: 15, active: null }, { offset: 55, y: 15, active: null }]; }
        draw() {
            ctx.fillStyle = '#00ffff'; ctx.fillRect(this.x - 10, this.y - 10, 20, 20);
            this.drawShield(35);
        }
        update() {
            if (keys.ArrowLeft || keys.a || keys.A) targetX -= this.speed;
            if (keys.ArrowRight || keys.d || keys.D) targetX += this.speed;
            targetX = Math.max(20, Math.min(canvas.width - 20, targetX));
            this.x += (targetX - this.x) * 0.3;
            if (this.shootCooldown > 0) this.shootCooldown--;
            else { this.shoot(); this.shootCooldown = Math.max(8, 20 - (this.weaponLevel * 2)); }
            hpBar.style.width = `${Math.max(0, (this.hp / this.maxHp) * 100)}%`;
            shieldBar.style.width = `${Math.max(0, (this.shield / this.maxShield) * 100)}%`;
            if (this.hp <= 0) isGameOver = true;
        }
        shoot() {
            projectiles.push(new Projectile(this.x, this.y - 20, 0, -12, '#00ffff'));
        }
    }

    class Projectile {
        constructor(x, y, vx, vy, color) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color; this.markedForDeletion = false; }
        draw() { ctx.fillStyle = this.color; ctx.fillRect(this.x - 2, this.y - 4, 4, 8); }
        update() { this.x += this.vx; this.y += this.vy; if (this.y < -50) this.markedForDeletion = true; }
    }

    class Enemy extends Entity {
        constructor() {
            super(Math.random() * (canvas.width - 40) + 20, -50);
            this.velocity = Math.min(10, 2 + Math.random() * 3 + (score * 0.002));
        }
        draw() { ctx.fillStyle = '#ff3333'; ctx.fillRect(this.x - 15, this.y - 15, 30, 30); }
        update() { this.y += this.velocity; if (this.y > canvas.height + 50) this.markedForDeletion = true; }
    }

    function createParticles(x, y, color, amount) { for(let i=0; i<amount; i++) particles.push({x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, color, markedForDeletion: false}); }

    function animate() {
        if (isGameOver) { finalScoreText.innerText = score; gameOverScreen.style.display = 'block'; return; }
        ctx.fillStyle = 'rgba(0, 0, 20, 0.4)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        player.update(); player.draw();
        if (frameCount++ % 40 === 0) enemies.push(new Enemy());

        [...projectiles, ...enemies, ...particles].forEach(e => { e.update(); e.draw(); });

        projectiles.forEach(p => enemies.forEach(e => {
            if (!e.markedForDeletion && Math.hypot(p.x - e.x, p.y - e.y) < 30) {
                p.markedForDeletion = true; e.takeDamage(20);
                if (e.markedForDeletion) score += 20; scoreText.innerText = score;
            }
        }));

        projectiles = projectiles.filter(p => !p.markedForDeletion);
        enemies = enemies.filter(e => !e.markedForDeletion);
        particles = particles.filter(p => { p.life -= 0.05; return p.life > 0; });

        requestAnimationFrame(animate);
    }

    function init() { player = new Player(); projectiles = []; enemies = []; particles = []; score = 0; isGameOver = false; gameOverScreen.style.display = 'none'; animate(); }
    init();
</script>
</body>
</html>
