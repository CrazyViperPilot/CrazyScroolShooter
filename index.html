<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibe Squadron - Touch & Upgrades</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Wichtig für flüssige Touch-Steuerung */
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 850px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #00001a, #000033);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        .stats {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bar-container {
            width: 100px;
            height: 10px;
            background: #333;
            border: 1px solid #fff;
            border-radius: 5px;
            overflow: hidden;
        }
        #hpBar { height: 100%; background: #ff3333; width: 100%; transition: width 0.2s; }
        #shieldBar { height: 100%; background: #33aaff; width: 100%; transition: width 0.2s; }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid cyan;
            border-radius: 10px;
            display: none;
            width: 80%;
        }
        button {
            margin-top: 15px;
            padding: 12px 25px;
            background-color: transparent;
            color: cyan;
            border: 2px solid cyan;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        button:hover, button:active {
            background-color: cyan;
            color: black;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="500" height="850"></canvas>
        <div id="ui">
            <div class="stats">
                <div style="color: #ff3333;">HP</div>
                <div class="bar-container"><div id="hpBar"></div></div>
                <div style="color: #33aaff; margin-top: 5px;">Schild</div>
                <div class="bar-container"><div id="shieldBar"></div></div>
            </div>
            <div style="text-align: right;">
                <div>Score: <span id="scoreText">0</span></div>
                <div style="color: #ffaa33; font-size: 14px; margin-top: 5px;">Waffen Lvl: <span id="weaponText">1</span></div>
            </div>
        </div>
        <div id="gameOver">
            <h2>MISSION FAILED</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button onclick="resetGame()">Neustart</button>
        </div>
    </div>

    const hpBar = document.getElementById('hpBar');

    const gameOverScreen = document.getElementById('gameOver');
    const finalScoreText = document.getElementById('finalScore');

    let isGameOver = false;
